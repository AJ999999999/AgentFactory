name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Versions
        run: |
          node --version
          git --version
          git config --show-origin --get core.autocrlf || echo "core.autocrlf not set"
      - name: Tests
        run: node --no-warnings --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./scripts/ci/gh-annotations.mjs --test-reporter-destination=stdout "test/**/*.test.ts"

  windows-task:
    name: scheduled task (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install the harness task, let it do a turn, remove it
        shell: powershell
        run: .\scripts\windows\ci-smoke.ps1
