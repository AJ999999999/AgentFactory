<!doctype html>
<html><head><meta charset="utf-8"><title>AgentFactory architecture</title>
<style>
html, body { margin: 0; background: #f6f4ee; }
svg { display: block; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
.box { fill: #ffffff; stroke: #c9cec6; stroke-width: 1.2; }
.t { font-size: 14px; font-weight: 650; fill: #1c2226; }
.s { font-size: 11.5px; fill: #5b636a; }
.mono { font-family: "Cascadia Code", Consolas, monospace; font-size: 10.6px; white-space: pre; }
.edge { fill: none; stroke: #c3c9c0; stroke-width: 1.6; }
.cap { font-size: 16px; font-weight: 600; fill: #1c2226; }
</style></head>
<body>
<svg id="s" width="1200" height="645" viewBox="0 0 1200 645"></svg>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const S = document.getElementById("s");
const C = { ink: "#1c2226", ink2: "#5b636a", ink3: "#8a9296", rule: "#c9cec6", accent: "#2b5c8f", amber: "#c27c0e", green: "#2c7a55", red: "#b8392b", paper: "#ffffff", hi: "#eef3f9" };
function el(tag, attrs = {}, parent = S, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  parent.appendChild(e);
  return e;
}

// ---------- layout ----------
const CLI = [
  { id: "copilot", name: "Copilot CLI", how: ["--allow-tool / --deny-tool", "per catalog permission"], color: "#6e40c9" },
  { id: "claude", name: "Claude Code", how: ["allowed tools, dontAsk", "no settings, no MCP"], color: "#c8643b" },
  { id: "codex", name: "Codex CLI", how: ["OS sandbox: worktree only", ".git read-only, no network"], color: "#10a37f" },
  { id: "pi", name: "pi", how: ["turn gate extension", "commands one at a time"], color: "#2b6cb0" },
  { id: "omp", name: "omp", how: ["turn gate extension", "the gate is the approval"], color: "#b83280" },
];
CLI.forEach((c, i) => { c.x = 270 + i * 182; c.cx = c.x + 85; });

const layers = { edges: el("g"), boxes: el("g"), over: el("g"), dots: el("g") };
const edges = {};
function edge(id, d, dash) {
  edges[id] = el("path", { d, class: "edge", ...(dash ? { "stroke-dasharray": "5 4" } : {}) }, layers.edges);
}
const boxes = {};
function box(id, x, y, w, h, title, sub = [], opts = {}) {
  const g = el("g", {}, layers.boxes);
  const r = el("rect", { x, y, width: w, height: h, rx: 6, class: "box" }, g);
  let bar = null;
  if (opts.color) bar = el("rect", { x, y, width: 5, height: h, rx: 2, fill: opts.color }, g);
  const tx = x + (opts.color ? 16 : 12);
  const tt = el("text", { x: tx, y: y + 22, class: "t" }, g, title);
  const ss = sub.map((s, i) => el("text", { x: tx, y: y + 40 + i * 15, class: "s" }, g, s));
  boxes[id] = { g, r, tt, ss, x, y, w, h, color: opts.color };
  return boxes[id];
}

// Title
el("text", { x: 20, y: 34, style: "font-size:20px;font-weight:700;fill:#1c2226" }, S, "AgentFactory");
el("text", { x: 152, y: 34, style: "font-size:15px;fill:#5b636a" }, S, "how one turn moves through the harness");

// Partner
el("text", { x: 20, y: 64, style: "font-size:12px;font-weight:700;letter-spacing:.06em;fill:#5b636a" }, S, "YOU, THE PARTNER");
box("p1", 20, 74, 210, 54, "Panel · 127.0.0.1", ["questions · live turns · Stop"]);
box("p2", 20, 138, 210, 54, "Partner MCP tools", ["from your Claude Code / Copilot"]);
box("p3", 20, 202, 210, 54, "Command line", ["answer · pause · budget"]);

// Event log
box("log", 270, 50, 250, 230, "Event log in git", ["append-only · state = project(log)"]);
const chipLayer = el("g", {}, layers.over);

// Tick pipeline
box("wake", 560, 60, 130, 90, "Loop wakes", ["Task Scheduler loop", "sleeps to next timer"]);
box("rules", 712, 60, 130, 90, "Rules", ["asks · blocks · budgets", "spin · kill criteria"]);
box("select", 864, 60, 130, 90, "Select", ["ready, riskiest first", "limits, people wait"]);
box("router", 1016, 60, 164, 90, "Router", ["by the seat's model:", "claude: codex: pi: omp:", "anything else → Copilot"]);
box("seat", 560, 172, 434, 70, "Seats", []);

// CLIs
for (const c of CLI) box(c.id, c.x, 320, 170, 90, c.name, c.how, { color: c.color });
const badge = el("g", { opacity: 0 }, layers.over);
el("rect", { x: CLI[1].x + 14, y: 386, width: 146, height: 20, rx: 10, fill: "#fbefd9", stroke: C.amber }, badge);
el("text", { x: CLI[1].x + 87, y: 400, "text-anchor": "middle", style: "font-size:11px;font-weight:650;fill:#8a5a06" }, badge, "usage limit · back at 06:00");

// Worktree, validate, merge
box("wt", 270, 436, 910, 40, "Worktree, one per turn", []);
el("text", { x: 452, y: 461, class: "s" }, layers.boxes, "lease on its write scope · AF_TURN set · git push goes nowhere · log in turns/<turn>.log");
box("validate", 870, 492, 145, 54, "Validate", ["scope, grades, red lines"]);
box("merge", 1035, 492, 145, 54, "Merge", ["commit + turn event"]);

// Legend under the worktree
const lg = el("g", {}, layers.boxes);
const lgt = el("text", { x: 270, y: 519, class: "s" }, lg, "Each seat's CLI comes from its model:");
let lx = 270 + lgt.getComputedTextLength() + 16;
for (const c of CLI) {
  el("circle", { cx: lx, cy: 515, r: 5, fill: c.color }, lg);
  const t = el("text", { x: lx + 9, y: 519, class: "s" }, lg, c.name);
  lx += 9 + t.getComputedTextLength() + 18;
}

// Live log console
box("console", 20, 300, 210, 238, "Live turn log", []);
const stopG = el("g", {}, layers.over);
const stopR = el("rect", { x: 170, y: 306, width: 52, height: 22, rx: 3, fill: "none", stroke: C.red }, stopG);
const stopT = el("text", { x: 196, y: 321, "text-anchor": "middle", style: "font-size:12px;font-weight:650", fill: C.red }, stopG, "Stop");
const conLines = el("g", {}, layers.over);

// Edges
edge("log_wake", "M520,105 L560,105");
edge("wake_rules", "M690,105 L712,105");
edge("rules_select", "M842,105 L864,105");
edge("select_router", "M994,105 L1016,105");
edge("rules_log", "M777,60 C777,26 528,26 506,50");
edge("p1_log", "M230,101 L270,101");
edge("p2_log", "M230,165 L270,165");
edge("p3_log", "M230,229 L270,229");
for (const c of CLI) edge(`route_${c.id}`, `M1098,150 C1098,292 ${c.cx},268 ${c.cx},320`);
for (const c of CLI) edge(`down_${c.id}`, `M${c.cx},410 L${c.cx},436`);
edge("wt_console", "M270,456 L230,456", true);
edge("wt_validate", "M942,476 L942,492");
edge("validate_merge", "M1015,519 L1035,519");
edge("merge_log", "M1107,546 L1107,556 Q1107,563 1099,563 L258,563 Q250,563 250,555 L250,268 Q250,260 258,260 L270,260");

// Caption
const capBox = el("rect", { x: 20, y: 580, width: 1160, height: 50, rx: 8, fill: "#1c2226" }, S);
const capNum = el("text", { x: 44, y: 611, style: "font-size:15px;font-weight:700", fill: "#f3d27a" }, S, "");
const capText = el("text", { x: 76, y: 611, style: "font-size:15.5px;font-weight:500", fill: "#f6f4ee" }, S, "");
const pips = [];
for (let i = 0; i < 9; i++) pips.push(el("circle", { cx: 1060 + i * 13, cy: 605, r: 4, fill: "#5b636a" }, S));

// ---------- the story ----------
const PHASE = 2.2;
const PHASES = [
  "The loop wakes on a timer, reads the event log and rebuilds the state",
  "Rules decide only what a rule may; the rest becomes a question for you",
  "You answer: from the panel, your own Claude Code or Copilot session, or the CLI",
  "Select the riskiest ready work; work waiting on a person, a job or a limit waits",
  "The router sends each seat to the CLI its model names",
  "The turn runs in its own worktree, held to its grant; its log streams to you",
  "The harness checks the work, merges it and records the turn in the log",
  "A usage limit is a wait, not a failure: only that vendor's seats wait",
  "Stop from the panel: the agent is killed, its changes discarded, and you're asked",
];

const CHIPS = [
  { p: -1, text: "engagement opened · 3 goals", kind: "base" },
  { p: -1, text: "seat staffed · build → builder", kind: "base" },
  { p: -1, text: "turn research · completed", kind: "ok" },
  { p: 1, at: 0.15, text: "ask · keep going, or drop it?", kind: "ask" },
  { p: 2, at: 0.35, text: "answer · keep going (partner)", kind: "ans" },
  { p: 6, at: 0.55, text: "turn build · completed, substantive", kind: "ok" },
  { p: 7, at: 0.3, text: "capacity · claude until 06:00", kind: "ask" },
  { p: 8, at: 0.45, text: "turn spike · stopped", kind: "stop" },
  { p: 8, at: 0.7, text: "ask · try it again, or drop it?", kind: "ask" },
];
const CHIP_STYLE = { base: ["#f1efe8", "#5b636a"], ok: ["#e4f1ea", "#2c7a55"], ask: ["#fbefd9", "#8a5a06"], ans: ["#e6eef7", "#2b5c8f"], stop: ["#eeeeee", "#5b636a"] };

const ROUTES = [
  ["builder", "model-a = (empty) → Copilot's default model", "repo:write:lease · shell:test"],
  ["strategist (judge)", "model-b = claude:opus", "repo:read only: no edits"],
  ["experimenter", "model-c = codex:", "repo:write:lease · shell:test"],
  ["builder", "model-a = pi:anthropic/claude-sonnet", "repo:write:lease · shell:test"],
  ["researcher", "model-a = omp:opus", "repo:write:lease · web:read"],
];

const PI_LOG = [
  "pi (turn gate on)",
  "tools: read grep find ls write",
  "      edit bash",
  "model: anthropic/claude-sonnet",
  "→ read: README.md",
  "→ bash: git status | head",
  "  ✗ only these commands, one",
  "    at a time",
  "→ write: work/launch.md",
  "→ bash: git status",
  "result: done",
];
const COPILOT_LOG = ["copilot --agent af-builder", "model: gpt-6-luna", "→ Applying patch:", "    app/launch/Screen.tsx", "→ Running: npm test", "  exit 0", "→ Applying patch:", "    app/launch/countdown.ts"];
const STOP_LOG = ["codex exec --sandbox", "     workspace-write", "→ npm test", "→ npm run build", "stop requested by the partner", "--- stopped by the partner"];

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
// A very light wash of a colour, for an active box.
function tint(hex) {
  const n = parseInt(hex.slice(1), 16);
  const mix = (c) => Math.round(c + (255 - c) * 0.9);
  return `rgb(${mix(n >> 16)},${mix((n >> 8) & 255)},${mix(n & 255)})`;
}
const ease = (x) => x * x * (3 - 2 * x);

function setOn(id, on, color) {
  const b = boxes[id];
  b.r.style.stroke = on ? (color || C.ink) : C.rule;
  b.r.style.strokeWidth = on ? "2.6" : "1.2";
  b.r.style.fill = on ? (color ? tint(color) : C.hi) : C.paper;
}
function edgeOn(id, on, color) {
  edges[id].style.stroke = on ? (color || C.ink) : "#c3c9c0";
  edges[id].style.strokeWidth = on ? "2.4" : "1.6";
}
// Dots travelling along an edge: u in [0,1] is the phase, a few dots spaced behind each other.
function flow(id, u, color = C.accent, reverse = false, n = 3) {
  const p = edges[id];
  const L = p.getTotalLength();
  edgeOn(id, true, color);
  for (let k = 0; k < n; k++) {
    const v = u * 1.5 - k * 0.22;
    if (v <= 0 || v >= 1) continue;
    const pt = p.getPointAtLength((reverse ? 1 - v : v) * L);
    el("circle", { cx: pt.x, cy: pt.y, r: 4.6, fill: color, stroke: "#fff", "stroke-width": 1.5 }, layers.dots);
  }
}
function seatText(lines, colors = []) {
  const b = boxes.seat;
  for (const t of b.ss) t.remove();
  b.ss = lines.map((s, i) => el("text", { x: b.x + 12, y: b.y + 40 + i * 15, class: "s", ...(colors[i] ? { style: `fill:${colors[i]};font-weight:600` } : {}) }, b.g, s));
}
function consoleText(lines, color = C.ink2, highlight = {}) {
  conLines.replaceChildren();
  lines.slice(-12).forEach((l, i) => el("text", { x: 30, y: 352 + i * 14.5, class: "mono", fill: highlight[l] || color }, conLines, l));
}
function chips(p, u) {
  chipLayer.replaceChildren();
  const now = p + u;
  const shown = CHIPS.filter((c) => c.p < 0 || now >= c.p + (c.at ?? 0));
  const last = shown.slice(-6);
  last.forEach((c, i) => {
    const age = c.p < 0 ? 9 : now - (c.p + (c.at ?? 0));
    const a = clamp(age / 0.18);
    const y = 272 - (last.length - i) * 25;
    const [bg, fg] = CHIP_STYLE[c.kind];
    const g = el("g", { transform: `translate(${(1 - ease(a)) * 24},0)`, opacity: a }, chipLayer);
    el("rect", { x: 282, y, width: 226, height: 20, rx: 4, fill: bg, ...(a < 1 ? { stroke: fg } : {}) }, g);
    el("text", { x: 291, y: y + 14, style: `font-size:11px;fill:${fg};font-weight:${c.kind === "base" ? 400 : 600}` }, g, c.text);
  });
}

window.render = function render(t) {
  const total = PHASE * PHASES.length;
  t = ((t % total) + total) % total;
  const p = Math.floor(t / PHASE);
  const u = (t - p * PHASE) / PHASE;
  layers.dots.replaceChildren();
  for (const id of Object.keys(boxes)) setOn(id, false);
  for (const id of Object.keys(edges)) edgeOn(id, false);
  badge.setAttribute("opacity", 0);
  stopR.setAttribute("fill", "none");
  stopT.setAttribute("fill", C.red);
  stopT.textContent = "Stop";
  boxes.p1.ss[0].textContent = "questions · live turns · Stop";
  boxes.p1.ss[0].setAttribute("style", "");
  seatText(["one per lane, staffed from the role library;", "grants come only from the permission catalog"]);
  consoleText(["(no turn running on this PC)"], C.ink3);

  switch (p) {
    case 0:
      setOn("wake", true); setOn("log", true);
      flow("log_wake", u);
      break;
    case 1:
      setOn("rules", true); setOn("log", true);
      flow("wake_rules", clamp(u * 2.2));
      if (u > 0.05) flow("rules_log", clamp((u - 0.05) * 1.6), C.amber);
      if (u > 0.55) { setOn("p1", true, C.amber); flow("p1_log", clamp((u - 0.55) * 2.4), C.amber, true); boxes.p1.ss[0].textContent = "1 question waiting on you"; boxes.p1.ss[0].setAttribute("style", `fill:${C.amber};font-weight:650`); }
      break;
    case 2:
      setOn("log", true);
      ["p1", "p2", "p3"].forEach((id, i) => {
        const v = clamp(u * 1.4 - i * 0.12);
        if (v > 0) { setOn(id, true, C.accent); flow(`${id}_log`, v, C.accent); }
      });
      break;
    case 3:
      setOn("select", true); setOn("rules", true);
      flow("rules_select", u);
      seatText(["picked: build · “launch screen” (P1, tests A2)", "waiting: playtest (on a person) · deploy (after build)"], [C.ink, C.ink2]);
      break;
    case 4: {
      setOn("router", true); setOn("seat", true);
      const k = Math.min(4, Math.floor(u * 5));
      const v = u * 5 - k;
      const c = CLI[k];
      setOn(c.id, true, c.color);
      flow(`route_${c.id}`, clamp(v * 1.3), c.color);
      seatText([`seat: ${ROUTES[k][0]} · ${ROUTES[k][1]}`, `grant: ${ROUTES[k][2]}`], [C.ink, C.ink2]);
      break;
    }
    case 5: {
      setOn("pi", true, CLI[3].color); setOn("wt", true, CLI[3].color); setOn("console", true, CLI[3].color);
      flow("down_pi", clamp(u * 2), CLI[3].color);
      if (u > 0.15) flow("wt_console", ((u - 0.15) * 3) % 1, CLI[3].color, false, 2);
      seatText(["handoff packet: goal · beliefs · the todo · write scope", "· what memory says about the people it serves"]);
      const n = Math.max(1, Math.floor(u * (PI_LOG.length + 2)));
      consoleText(PI_LOG.slice(0, n), C.ink, { "  ✗ only these commands, one": C.red, "    at a time": C.red, "result: done": C.green });
      break;
    }
    case 6:
      setOn("wt", true); setOn("validate", true, C.green); setOn("merge", true, C.green); setOn("log", true);
      flow("wt_validate", clamp(u * 3), C.green);
      if (u > 0.2) flow("validate_merge", clamp((u - 0.2) * 3), C.green);
      if (u > 0.3) flow("merge_log", clamp((u - 0.3) * 1.5), C.green, false, 4);
      consoleText([...PI_LOG.slice(-3), "--- completed (substantive)"], C.ink3, { "--- completed (substantive)": C.green });
      break;
    case 7:
      setOn("claude", true, C.amber); setOn("select", true); setOn("router", true); setOn("log", true);
      badge.setAttribute("opacity", clamp(u * 4));
      setOn("copilot", true, CLI[0].color); setOn("wt", true, CLI[0].color); setOn("console", true, CLI[0].color);
      flow("route_copilot", (u * 1.6) % 1, CLI[0].color, false, 2);
      seatText(["judge seats on model-b (Claude) wait until 06:00;", "builders on Copilot carry on · no failure, no budget spent"], [C.amber, C.ink2]);
      consoleText(COPILOT_LOG.slice(0, Math.max(1, Math.floor(u * (COPILOT_LOG.length + 1)))), C.ink);
      break;
    case 8: {
      setOn("codex", true, CLI[2].color); setOn("console", true, C.red); setOn("log", true);
      const pressed = u > 0.2;
      setOn("wt", true, pressed ? C.red : CLI[2].color);
      if (pressed) { stopR.setAttribute("fill", C.red); stopT.setAttribute("fill", "#fff"); flow("wt_console", clamp((u - 0.2) * 3), C.red, true, 2); }
      const n = pressed ? STOP_LOG.length - (u > 0.45 ? 0 : 1) - (u > 0.3 ? 0 : 1) : 4;
      consoleText(STOP_LOG.slice(0, n), C.ink, { "stop requested by the partner": C.red, "--- stopped by the partner": C.red });
      if (u > 0.7) { setOn("p1", true, C.amber); flow("p1_log", clamp((u - 0.7) * 3.5), C.amber, true); boxes.p1.ss[0].textContent = "1 question waiting on you"; boxes.p1.ss[0].setAttribute("style", `fill:${C.amber};font-weight:650`); }
      break;
    }
  }
  chips(p, u);
  capNum.textContent = `${p + 1}`;
  capText.textContent = PHASES[p];
  pips.forEach((c, i) => c.setAttribute("fill", i === p ? "#f3d27a" : "#5b636a"));
};
window.TOTAL = PHASE * PHASES.length;
render(0);
// Opened in a browser it plays by itself; the GIF maker opens it with ?capture and steps it.
if (!new URLSearchParams(location.search).has("capture")) {
  const t0 = performance.now();
  const tick = (now) => { render((now - t0) / 1000); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
</script>
</body></html>
