<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 580" width="1000" height="580" role="img" aria-labelledby="t d">
  <title id="t">AgentFactory architecture</title>
  <desc id="d">The foundation takes a hard problem from frame to a tested MVP plan and opens an engagement. The harness then loops: each wake reads state from git, applies its rules, picks the riskiest open work, claims it and leases its paths, and a router sends the seat to the CLI its model names: Copilot CLI, Claude Code, Codex, pi or omp. The turn runs in its own git worktree and cannot push; the harness validates it and merges it into the event log. A usage limit makes only that vendor's seats wait for the reset. Jobs, metric sources and experts add graded evidence. Questions only the partner can decide go to the partner as decision cards; the partner answers from the local panel, their own Claude Code or Copilot session, or the command line, and can watch and stop running turns. Typed memory about the people served feeds each turn's packet as defaults, never as permission.</desc>
  <style>
    svg { --bg:#ffffff; --ink:#1f2328; --muted:#59636e; --line:#c8d1da; --box:#f6f8fa; --edge:#d1d9e0;
          --found:#8250df; --loop:#0969da; --world:#1a7f37; --ask:#bf5700; --mem:#9a6700; --wait:#cf222e;
          --c1:#6e40c9; --c2:#c8643b; --c3:#10a37f; --c4:#2b6cb0; --c5:#b83280; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --ink:#e6edf3; --muted:#9198a1; --line:#3d444d; --box:#151b23; --edge:#3d444d;
            --found:#ab7df8; --loop:#4493f8; --world:#3fb950; --ask:#f0883e; --mem:#d29922; --wait:#f85149;
            --c1:#a371f7; --c2:#e3845a; --c3:#3fcf9f; --c4:#58a6ff; --c5:#e267b5; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--ink); }
    .bg { fill: var(--bg); }
    .h { font-size: 13px; font-weight: 600; }
    .s { font-size: 11px; fill: var(--muted); }
    .chip { font-size: 10.5px; font-weight: 600; }
    .band { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: var(--muted); }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1; }
    .found { stroke: var(--found); } .loop { stroke: var(--loop); } .world { stroke: var(--world); }
    .askb { stroke: var(--ask); } .memb { stroke: var(--mem); }
    .wire { fill: none; stroke: var(--line); stroke-width: 2; }
    .wire.l { stroke: var(--loop); stroke-opacity: .35; }
    .wire.a { stroke: var(--ask); stroke-opacity: .45; stroke-dasharray: 5 4; }
    .wire.v { stroke: var(--loop); stroke-opacity: .45; stroke-dasharray: 2 3; }
    .wire.w { stroke: var(--world); stroke-opacity: .5; }
    .wire.m { stroke: var(--mem); stroke-opacity: .5; }
    .wire.f { stroke: var(--found); stroke-opacity: .5; }
    .dot-l { fill: var(--loop); } .dot-a { fill: var(--ask); } .dot-w { fill: var(--world); }
    .dot-m { fill: var(--mem); } .dot-f { fill: var(--found); } .dot-x { fill: var(--wait); }
    .glow-f { fill: var(--found); }
    .arrow { fill: var(--muted); }
    .wait { font-size: 11px; fill: var(--wait); }
  </style>

  <rect class="bg" width="1000" height="580" rx="12"/>

  <!-- ========== Foundation band ========== -->
  <text class="band" x="24" y="30">FOUNDATION · A HARD PROBLEM TO A TESTED MVP</text>
  <g>
    <rect class="box found" x="24" y="42" width="104" height="52" rx="8"/>
    <rect class="glow-f" x="24" y="42" width="104" height="52" rx="8" opacity="0"><animate attributeName="opacity" values="0;.18;0;0" keyTimes="0;.08;.16;1" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
    <text class="h" x="76" y="64" text-anchor="middle">Frame</text>
    <text class="s" x="76" y="81" text-anchor="middle">owner confirms</text>
  </g>
  <g>
    <rect class="box found" x="146" y="42" width="104" height="52" rx="8"/>
    <rect class="glow-f" x="146" y="42" width="104" height="52" rx="8" opacity="0"><animate attributeName="opacity" values="0;.18;0;0" keyTimes="0;.08;.16;1" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
    <text class="h" x="198" y="64" text-anchor="middle">Diverge</text>
    <text class="s" x="198" y="81" text-anchor="middle">sealed per angle</text>
  </g>
  <g>
    <rect class="box found" x="268" y="42" width="104" height="52" rx="8"/>
    <rect class="glow-f" x="268" y="42" width="104" height="52" rx="8" opacity="0"><animate attributeName="opacity" values="0;.18;0;0" keyTimes="0;.08;.16;1" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
    <text class="h" x="320" y="64" text-anchor="middle">Critique</text>
    <text class="s" x="320" y="81" text-anchor="middle">never your own</text>
  </g>
  <g>
    <rect class="box found" x="390" y="42" width="104" height="52" rx="8"/>
    <rect class="glow-f" x="390" y="42" width="104" height="52" rx="8" opacity="0"><animate attributeName="opacity" values="0;.18;0;0" keyTimes="0;.08;.16;1" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
    <text class="h" x="442" y="64" text-anchor="middle">Score</text>
    <text class="s" x="442" y="81" text-anchor="middle">frozen criteria</text>
  </g>
  <g>
    <rect class="box found" x="512" y="42" width="104" height="52" rx="8"/>
    <rect class="glow-f" x="512" y="42" width="104" height="52" rx="8" opacity="0"><animate attributeName="opacity" values="0;.18;0;0" keyTimes="0;.08;.16;1" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
    <text class="h" x="564" y="64" text-anchor="middle">Converge</text>
    <text class="s" x="564" y="81" text-anchor="middle">only the owner</text>
  </g>
  <g>
    <rect class="box found" x="634" y="42" width="104" height="52" rx="8"/>
    <rect class="glow-f" x="634" y="42" width="104" height="52" rx="8" opacity="0"><animate attributeName="opacity" values="0;.18;0;0" keyTimes="0;.08;.16;1" dur="6s" begin="5s" repeatCount="indefinite"/></rect>
    <text class="h" x="686" y="64" text-anchor="middle">MVP plan</text>
    <text class="s" x="686" y="81" text-anchor="middle">build, then test</text>
  </g>
  <g class="arrow">
    <path d="M132,64 l8,4 -8,4z"/><path d="M254,64 l8,4 -8,4z"/><path d="M376,64 l8,4 -8,4z"/>
    <path d="M498,64 l8,4 -8,4z"/><path d="M620,64 l8,4 -8,4z"/>
  </g>

  <!-- MVP plan opens the engagement -->
  <path id="p-open" class="wire f" d="M686,94 V112 H110 V186"/>
  <text class="s" x="300" y="128">opens the engagement: goals, assumptions, kill criteria</text>
  <circle class="dot-f" r="4"><animateMotion dur="6s" begin="5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.3;1" calcMode="linear"><mpath xlink:href="#p-open"/></animateMotion></circle>

  <!-- ========== Harness loop ========== -->
  <rect x="16" y="146" width="724" height="354" rx="12" fill="none" stroke="var(--line)" stroke-dasharray="2 4"/>
  <text class="band" x="30" y="166">HARNESS · ONE WAKE, MONTHS ON END</text>

  <path id="p-loop" class="wire l" d="M110,220 H649 V415 H110 Z"/>
  <g class="arrow">
    <path d="M194,216 l8,4 -8,4z"/><path d="M378,216 l8,4 -8,4z"/><path d="M556,216 l8,4 -8,4z"/>
    <path d="M645,260 l4,8 4,-8z"/><path d="M645,350 l4,8 4,-8z"/>
    <path d="M436,411 l-8,4 8,4z"/><path d="M280,411 l-8,4 8,4z"/>
    <path d="M106,340 l4,-8 4,8z"/>
  </g>
  <circle class="dot-l" r="5"><animateMotion dur="10s" repeatCount="indefinite"><mpath xlink:href="#p-loop"/></animateMotion></circle>
  <circle class="dot-l" r="5"><animateMotion dur="10s" begin="-3.33s" repeatCount="indefinite"><mpath xlink:href="#p-loop"/></animateMotion></circle>
  <circle class="dot-l" r="5"><animateMotion dur="10s" begin="-6.66s" repeatCount="indefinite"><mpath xlink:href="#p-loop"/></animateMotion></circle>

  <g>
    <rect class="box loop" x="40" y="190" width="140" height="60" rx="8"/>
    <text class="h" x="110" y="214" text-anchor="middle">Wake</text>
    <text class="s" x="110" y="231" text-anchor="middle">starts from git,</text>
    <text class="s" x="110" y="244" text-anchor="middle">never from a transcript</text>
  </g>
  <g>
    <rect class="box loop" x="216" y="190" width="150" height="60" rx="8"/>
    <text class="h" x="291" y="214" text-anchor="middle">Rules</text>
    <text class="s" x="291" y="231" text-anchor="middle">spin, caps, budgets,</text>
    <text class="s" x="291" y="244" text-anchor="middle">gates, probation</text>
  </g>
  <g>
    <rect class="box loop" x="396" y="190" width="150" height="60" rx="8"/>
    <text class="h" x="471" y="214" text-anchor="middle">Pick the work</text>
    <text class="s" x="471" y="231" text-anchor="middle">riskiest open</text>
    <text class="s" x="471" y="244" text-anchor="middle">assumption first</text>
  </g>
  <g>
    <rect class="box loop" x="574" y="190" width="150" height="60" rx="8"/>
    <text class="h" x="649" y="214" text-anchor="middle">Claim + lease</text>
    <text class="s" x="649" y="231" text-anchor="middle">atomic ref push;</text>
    <text class="s" x="649" y="244" text-anchor="middle">a seat per lane</text>
  </g>
  <g>
    <rect class="box loop" x="574" y="280" width="150" height="56" rx="8"/>
    <text class="h" x="649" y="302" text-anchor="middle">Router</text>
    <text class="s" x="649" y="319" text-anchor="middle">the seat's model picks</text>
    <text class="s" x="649" y="331" text-anchor="middle">which CLI runs it</text>
  </g>

  <!-- the turn: five CLIs, the router's pick cycles -->
  <g>
    <rect class="box loop" x="446" y="368" width="278" height="94" rx="8"/>
    <text class="h" x="585" y="389" text-anchor="middle">Turn, in its own git worktree</text>
    <text class="s" x="585" y="405" text-anchor="middle">only what the catalog grants; it can't push</text>
    <g>
      <rect x="456" y="418" width="56" height="22" rx="11" fill="var(--c1)" fill-opacity=".12" stroke="var(--c1)"/>
      <rect x="456" y="418" width="56" height="22" rx="11" fill="var(--c1)" opacity="0"><animate attributeName="opacity" values="0;.45;.45;0;0" keyTimes="0;.02;.18;.2;1" dur="10s" begin="0s" repeatCount="indefinite"/></rect>
      <text class="chip" x="484" y="433" text-anchor="middle">Copilot</text>
      <rect x="518" y="418" width="78" height="22" rx="11" fill="var(--c2)" fill-opacity=".12" stroke="var(--c2)"/>
      <rect x="518" y="418" width="78" height="22" rx="11" fill="var(--c2)" opacity="0"><animate attributeName="opacity" values="0;.45;.45;0;0" keyTimes="0;.02;.18;.2;1" dur="10s" begin="2s" repeatCount="indefinite"/></rect>
      <text class="chip" x="557" y="433" text-anchor="middle">Claude Code</text>
      <rect x="602" y="418" width="48" height="22" rx="11" fill="var(--c3)" fill-opacity=".12" stroke="var(--c3)"/>
      <rect x="602" y="418" width="48" height="22" rx="11" fill="var(--c3)" opacity="0"><animate attributeName="opacity" values="0;.45;.45;0;0" keyTimes="0;.02;.18;.2;1" dur="10s" begin="4s" repeatCount="indefinite"/></rect>
      <text class="chip" x="626" y="433" text-anchor="middle">Codex</text>
      <rect x="656" y="418" width="28" height="22" rx="11" fill="var(--c4)" fill-opacity=".12" stroke="var(--c4)"/>
      <rect x="656" y="418" width="28" height="22" rx="11" fill="var(--c4)" opacity="0"><animate attributeName="opacity" values="0;.45;.45;0;0" keyTimes="0;.02;.18;.2;1" dur="10s" begin="6s" repeatCount="indefinite"/></rect>
      <text class="chip" x="670" y="433" text-anchor="middle">pi</text>
      <rect x="690" y="418" width="28" height="22" rx="11" fill="var(--c5)" fill-opacity=".12" stroke="var(--c5)"/>
      <rect x="690" y="418" width="28" height="22" rx="11" fill="var(--c5)" opacity="0"><animate attributeName="opacity" values="0;.45;.45;0;0" keyTimes="0;.02;.18;.2;1" dur="10s" begin="8s" repeatCount="indefinite"/></rect>
      <text class="chip" x="704" y="433" text-anchor="middle">omp</text>
    </g>
    <text class="s" x="585" y="455" text-anchor="middle">judges run on another vendor (Claude Code by default)</text>
  </g>
  <!-- usage limit: that vendor waits -->
  <circle class="dot-x" cx="446" cy="484" r="4"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <text class="wait" x="456" y="488">usage limit: that vendor's seats wait for the reset, free</text>

  <g>
    <rect class="box loop" x="290" y="380" width="134" height="70" rx="8"/>
    <text class="h" x="357" y="402" text-anchor="middle">Validate + merge</text>
    <text class="s" x="357" y="419" text-anchor="middle">scope, grades, red lines;</text>
    <text class="s" x="357" y="433" text-anchor="middle">only the harness merges</text>
  </g>
  <g>
    <rect class="box loop" x="40" y="380" width="226" height="70" rx="8"/>
    <text class="h" x="153" y="402" text-anchor="middle">Event log in git</text>
    <text class="s" x="153" y="419" text-anchor="middle">append-only; state = project(log)</text>
    <text class="s" x="153" y="433" text-anchor="middle">beliefs only from graded evidence</text>
  </g>

  <!-- world evidence into the log -->
  <g>
    <rect class="box world" x="140" y="282" width="210" height="52" rx="8"/>
    <text class="h" x="245" y="303" text-anchor="middle">The world</text>
    <text class="s" x="245" y="320" text-anchor="middle">jobs, metric sources, experts</text>
  </g>
  <path id="p-world" class="wire w" d="M200,334 V378"/>
  <text class="s" x="208" y="362">measured, behavioral</text>
  <circle class="dot-w" r="4"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#p-world"/></animateMotion></circle>

  <!-- ========== Partner column ========== -->
  <text class="band" x="776" y="30">THE PARTNER</text>
  <g>
    <rect class="box askb" x="776" y="42" width="200" height="84" rx="8"/>
    <circle cx="806" cy="70" r="9" fill="none" stroke="var(--ask)" stroke-width="2"/>
    <path d="M790,100 a16,14 0 0 1 32,0" fill="none" stroke="var(--ask)" stroke-width="2"/>
    <text class="h" x="834" y="70">One human</text>
    <text class="s" x="834" y="87">decides direction,</text>
    <text class="s" x="834" y="101">money, and what only</text>
    <text class="s" x="834" y="115">a person can do</text>
  </g>
  <path class="wire a" d="M876,128 V150"/>
  <g>
    <rect class="box askb" x="776" y="152" width="200" height="112" rx="8"/>
    <text class="h" x="876" y="173" text-anchor="middle">Local panel</text>
    <text class="s" x="876" y="190" text-anchor="middle">every project folder, one page</text>
    <text class="s" x="876" y="204" text-anchor="middle">decision cards: the agent's pick</text>
    <text class="s" x="876" y="218" text-anchor="middle">and what each option leads to</text>
    <text class="s" x="876" y="236" text-anchor="middle">live turn logs, with Stop</text>
    <text class="s" x="876" y="252" text-anchor="middle">a view of the log, no state</text>
  </g>
  <g>
    <rect class="box askb" x="776" y="272" width="200" height="60" rx="8"/>
    <text class="h" x="876" y="293" text-anchor="middle">Your own session, or the CLI</text>
    <text class="s" x="876" y="310" text-anchor="middle">MCP tools in Claude Code or</text>
    <text class="s" x="876" y="323" text-anchor="middle">Copilot; never inside a turn</text>
  </g>

  <!-- asks: Rules -> panel -->
  <path id="p-ask" class="wire a" d="M291,190 V176 H766 V200 H774"/>
  <text class="s" x="540" y="171">a question only you can decide</text>
  <circle class="dot-a" r="4.5"><animateMotion dur="7s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.4;1" calcMode="linear"><mpath xlink:href="#p-ask"/></animateMotion></circle>

  <!-- live log: turn -> panel -->
  <path id="p-live" class="wire v" d="M724,392 H750 V240 H774"/>
  <circle class="dot-l" r="3"><animateMotion dur="2s" repeatCount="indefinite"><mpath xlink:href="#p-live"/></animateMotion></circle>

  <!-- answers: partner -> log -->
  <path id="p-ans" class="wire a" d="M774,318 H762 V520 H153 V452"/>
  <text class="s" x="440" y="538">your answer, graded by who answered, back into the log</text>
  <circle class="dot-a" r="4.5"><animateMotion dur="7s" begin="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.45;1" calcMode="linear"><mpath xlink:href="#p-ans"/></animateMotion></circle>

  <!-- memory -->
  <g>
    <rect class="box memb" x="776" y="372" width="200" height="88" rx="8"/>
    <text class="h" x="876" y="395" text-anchor="middle">Memory about you</text>
    <text class="s" x="876" y="413" text-anchor="middle">typed, sourced, decays;</text>
    <text class="s" x="876" y="427" text-anchor="middle">feeds each turn's packet</text>
    <text class="s" x="876" y="441" text-anchor="middle">as defaults, never permission</text>
  </g>
  <path id="p-mem" class="wire m" d="M774,430 H726"/>
  <circle class="dot-m" r="4"><animateMotion dur="2.5s" repeatCount="indefinite"><mpath xlink:href="#p-mem"/></animateMotion></circle>

  <text class="s" x="24" y="566">Everything runs on plain git: no database, no server. State lives under .af/harness/&lt;id&gt;/ in the folder where the engagement was opened.</text>
</svg>
