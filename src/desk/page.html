<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentFactory desk</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#13242c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
/*__PANEL_CSS__*/

/* ---------- the desk's own pieces, in the panel's vocabulary ----------
   One loud thing: a command waiting for your yes is drawn the way its PowerShell
   window draws it. Everything else stays in the panel's quiet strips. */
:root { --ps: #012456; --ps-ink: #eeedf0; --ps-dim: #9fb0cc; --namew: 128px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code, .ps, pre { font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace; }

/* the header is the status line: how many threads are in each state */
header { flex-wrap: wrap; row-gap: 8px; }
header .spacer { flex: 1; }
.tally { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink-2); }
.tally span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tally i { width: 9px; height: 9px; border-radius: 1px; background: var(--kind, var(--ink-3)); }
.tally b { color: var(--ink); font-weight: 650; }
.tally .t-approval { --kind: var(--approval); }
.tally .t-action { --kind: var(--action); }
.tally .new-key i { border-radius: 50%; background: var(--focus); }
.start-btn { border: 0; background: var(--ink); color: var(--rack); border-radius: 2px; padding: 5px 12px; font-size: 13.5px; font-weight: 600; }
#away[aria-pressed="true"] { background: var(--ink); color: var(--rack); border-color: var(--ink); }
.ask .on-teams { color: var(--ink); font-weight: 600; }
.start-btn[aria-pressed="true"] { background: none; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink-2); }

/* groups */
.group { display: flex; align-items: baseline; gap: 8px; margin: 22px 0 4px; font-size: 14px; font-weight: 400; color: var(--ink-2); }
.group:first-child { margin-top: 0; }
.group .call { font-size: 16px; color: var(--ink); }
.calm { margin: 0 0 4px; padding: 10px 14px; color: var(--ink-2); font-size: 14px; border: 1px dashed var(--rule); border-radius: 2px; }

/* a thread: name and where on the left, what it's about, how long, and the way to its terminal */
.th.k-working { --kind: var(--ink-3); }
.th.k-closed { --kind: var(--rule); }
.th-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: start; padding-left: 7px; }
.th-head { display: grid; grid-template-columns: var(--namew) minmax(0, 1fr); gap: 0 14px; min-width: 0; padding: 10px 0 10px 14px; border: 0; background: none; text-align: left; }
.th-name { display: flex; flex-direction: column; min-width: 0; font-size: 14px; line-height: 1.3; }
.th-name > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th-name .call { font-size: 15px; }
.th-name .where { color: var(--ink-2); font-size: 13px; font-stretch: 87%; }
.th-name .dot { display: inline-block; width: 7px; height: 7px; margin: 0 6px 1px 0; border-radius: 50%; background: var(--focus); vertical-align: middle; }
.th-text { min-width: 0; }
.th-title { display: block; font-size: 15.5px; line-height: 1.35; font-weight: 550; }
.th-line { display: block; margin-top: 2px; font-size: 13.5px; line-height: 1.4; color: var(--ink-2); }
.th-line code { font-size: 12.5px; color: var(--ink); }
.th-line.mail { color: var(--action); }
.compact .th-title, .compact .th-line { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.k-closed .th-title { font-weight: 400; color: var(--ink-2); }
.th-age { padding: 12px 12px 0 10px; font-size: 13px; color: var(--ink-2); font-stretch: 87%; white-space: nowrap; }
.th-age.waiting { color: var(--ink); font-weight: 600; }
.th-go { align-self: start; margin: 6px 8px 0 -4px; width: 32px; height: 30px; border: 1px solid transparent; border-radius: 2px; background: none; color: var(--ink-2); font-size: 16px; line-height: 1; }
.th-go:hover { border-color: var(--ink-2); color: var(--ink); background: var(--paper-hi); }
.th-head:hover .th-title { text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; }
.th .body, .th-now, .th-err { padding: 0 18px 14px calc(7px + 14px + var(--namew) + 14px); }
.th .body { padding-top: 12px; border-top: 1px dashed var(--rule); }
.th-err { padding-bottom: 10px; }
.th-now > * + * { margin-top: 10px; }

/* what a thread that needs you is waiting on, without opening it */
.ps { display: block; background: var(--ps); color: var(--ps-ink); padding: 9px 12px; border-radius: 2px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9.5em; overflow: auto; }
.ps .p { color: var(--ps-dim); }
.asked { margin: 0; padding: 1px 0 1px 12px; border-left: 3px solid var(--kind); font-size: 15px; max-width: 70ch; }
.th-now .options { margin-top: 10px; }
.go-btn { border: 0; background: var(--ink); color: var(--paper); border-radius: 2px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
.go-btn:hover { background: var(--ink-2); }
.hint { color: var(--ink-2); font-size: 13.5px; }
.opt.allow { border-color: var(--good); color: var(--good); }
.opt.deny { border-color: var(--bad); color: var(--bad); }
.opt.quiet-opt { border-color: transparent; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.form.row { display: flex; gap: 8px; align-items: center; max-width: none; margin-top: 8px; }
.form.row input[type=text] { flex: 1; min-width: 160px; }

/* inside an open thread */
.mode { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); margin-right: 8px; }
.mode .seg button { padding: 3px 10px; font-size: 13px; }
.did { font-size: 13.5px; color: var(--ink-2); }
.did b { color: var(--ink); font-weight: 550; }
.did .files { list-style: none; margin: 4px 0 0; padding: 0; font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; }
.did .files .dir { color: var(--ink-3); }
.did .files .base { color: var(--ink); }
.did .files .link-btn { font: inherit; font-family: Archivo, "Segoe UI", system-ui, sans-serif; font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; }
.said { white-space: pre-wrap; max-height: 16em; overflow: auto; }
.th .live { margin-top: 12px; }
.knows { margin-top: 16px; }
.knows .work li.k-guess .g { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.knows .work li.k-sure .g { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.knows .work li.k-guess span { color: var(--ink-2); }
.seat button { border: 0; background: none; padding: 0 0 0 2px; color: var(--ink-3); }
.seat button:hover { color: var(--bad); }
.notes { margin-top: 14px; font-size: 14px; }
.notes .note { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; color: var(--ink-2); }
.notes .note b { color: var(--ink); font-weight: 550; }
.notes .note.waiting span:last-child::after { content: " · waits for its next tool call"; color: var(--ink-3); }
.notes .note.unread span:last-child::after { content: " · unread"; color: var(--ink-3); }
.send { display: flex; gap: 6px; margin-top: 8px; }
.send input, .send select { flex: 1; min-width: 0; border: 1px solid var(--rule); border-bottom-color: var(--ink-3); background: var(--paper); border-radius: 2px; padding: 5px 8px; font-size: 14px; }
.send select { flex: 0 1 auto; }
.send button { border: 1px solid var(--ink-2); background: none; border-radius: 2px; padding: 4px 12px; font-size: 13.5px; }
.send button:hover { border-color: var(--ink); }

/* a new thread, opened from the header */
.start { background: var(--paper); box-shadow: var(--shadow); border-radius: 2px; padding: 14px 18px 16px; margin-bottom: 18px; }
.start .send input { background: var(--rack); }
.start .about { font-size: 13.5px; margin-top: 8px; }
.send .cancel { border: 0; padding: 4px 6px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.start + .group { margin-top: 0; }
.send .go-btn { border: 0; background: var(--ink); color: var(--paper); font-weight: 600; }
.send .go-btn:hover { background: var(--ink-2); }
.th .form.row input[type=text] { background: var(--paper); padding: 6px 10px; }

/* the right column */
.side { padding: 0 0 22px; }
.side + .side { padding-top: 16px; border-top: 2px solid var(--ink); }
.side .about { font-size: 13.5px; margin-top: 6px; }
.side .th { --namew: 92px; }
.side .th + .th { margin-top: 8px; }
.talk { margin-top: 12px; font-size: 14px; display: grid; gap: 6px; }
.talk .note { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 8px; color: var(--ink-2); }
.talk .note b { color: var(--ink); font-weight: 600; }
.talk .note.unread { color: var(--ink); }
.talk .note.unread b { color: var(--action); }
.talk .note .dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--focus); vertical-align: middle; }
.talk .note button { border: 1px solid var(--action); color: var(--action); background: none; border-radius: 2px; padding: 0 8px; font-size: 12.5px; margin-left: 6px; }
.talk .note .st { color: var(--ink-3); }
.learning { margin-top: 14px; font-size: 13.5px; color: var(--ink-2); }
.learning .row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; }
.learning .row.bad span:nth-child(2) { color: var(--bad); }
.learning .where { font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; margin-top: 6px; }


/* ---------- three parts: the threads (top left), the one you picked (bottom left),
   and a terminal (right), which you swap with the terminal button on any thread ---------- */
:root { --term-bg: #161b1e; --term-ink: #e6e3da; --term-dim: #8f989c; }
main.desk { grid-template-columns: minmax(360px, 0.82fr) minmax(0, 1.18fr); gap: 20px; height: calc(100vh - 52px); min-height: 520px; padding-bottom: 16px; align-items: stretch; }
#left { display: flex; flex-direction: column; min-height: 0; gap: 10px; }
#start-slot:empty { display: none; }
#start-slot .start { margin: 0; }
#list { flex: 0 1 auto; max-height: 52%; min-height: 96px; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 4px 8px 1px; --namew: 96px; }
#list > * { flex: none; }
#list .group { margin: 10px 0 0; font-size: 13px; }
#list .group:first-child { margin-top: 2px; }
#list .group .call { font-size: 14px; }
#list .calm { padding: 7px 12px; font-size: 13.5px; }
#list .th-head { padding: 7px 0 7px 12px; }
#list .th-title { font-size: 14.5px; }
#list .th-line { font-size: 13px; }
#list .th-age { padding-top: 9px; }
#list .th-go { margin-top: 4px; }
.th.sel { background: var(--paper-hi); box-shadow: var(--shadow), inset 0 0 0 1.5px var(--ink-2); }
.th-go .icon, .icon { display: inline-flex; vertical-align: -3px; }
.th-go.on { color: var(--paper); background: var(--ink); border-color: var(--ink); }

#detail { flex: 1 1 0; min-height: 180px; overflow: auto; background: var(--paper); box-shadow: var(--shadow); border-radius: 2px; position: relative; padding: 14px 18px 18px 25px; }
#detail::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 7px; background: var(--kind, var(--rule)); }
#detail.k-approval { --kind: var(--approval); }
#detail.k-decision { --kind: var(--decision); }
#detail.k-action { --kind: var(--action); }
#detail.k-working { --kind: var(--ink-3); }
#detail > * + * { margin-top: 12px; }
.dt-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.dt-head .call { font-size: 17px; }
.dt-head .where { color: var(--ink-2); font-size: 13.5px; }
.dt-head .grow { flex: 1; }
.dt-head .th-age { padding: 0; }
.dt-title { margin: 4px 0 0; font-size: 18px; line-height: 1.35; font-weight: 550; max-width: 70ch; }
.ghost-btn { border: 1px solid var(--ink-2); background: none; border-radius: 2px; padding: 4px 10px; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.ghost-btn:hover { border-color: var(--ink); background: var(--paper-hi); }
.ghost-btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick { color: var(--ink-2); max-width: 52ch; }
#detail .th-now { padding: 0; }

#right { display: flex; flex-direction: column; min-height: 0; background: var(--term-bg); color: var(--term-ink); border-radius: 2px; box-shadow: var(--shadow); overflow: hidden; }
#term-head { flex: none; display: flex; align-items: baseline; gap: 10px; padding: 9px 12px 8px 14px; border-bottom: 1px solid rgba(255, 255, 255, .1); font-size: 14px; min-height: 40px; }
#term-head .call { font-size: 16px; }
#term-head .tt { color: var(--term-dim); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#term-head button { border: 1px solid rgba(255, 255, 255, .35); background: none; color: var(--term-ink); border-radius: 2px; padding: 3px 10px; font-size: 13px; white-space: nowrap; }
#term-head button:hover { border-color: var(--term-ink); }
#term-head button.danger { border-color: #e8735f; color: #f0a091; }
#term-head .on-desk { font-size: 12.5px; color: var(--term-dim); white-space: nowrap; }
#term-body { flex: 1; min-height: 0; position: relative; }
#xterm { position: absolute; inset: 6px 4px 4px 12px; }
#xterm .xterm-viewport { scrollbar-color: #3b4a52 transparent; }
/* Scroll position is kept by hand when earlier turns go in above (loadEarlier). */
#mirror { position: absolute; inset: 0; overflow: auto; overflow-anchor: none; padding: 12px 50px 18px 18px; font-size: 13.5px; line-height: 1.5; }
#mirror > * + *, #m-turns > * + * { margin-top: 6px; }
#mirror .m-earlier { color: var(--term-dim); font-size: 12.5px; text-align: center; }
#term-head .t-progress { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--term-dim); }
#term-head .t-progress i { width: 8px; height: 8px; border-radius: 50%; background: #d9aa4a; }
#term-head .t-progress.p-working i { animation: t-pulse 1.2s ease-in-out infinite; }
#term-head .t-progress.p-error i { background: #e8735f; }
@keyframes t-pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { #term-head .t-progress.p-working i { animation: none; } }
.m-new { position: absolute; right: 22px; bottom: 16px; padding: 5px 12px; border-radius: 14px; border: 1px solid #3b4a52; background: #24313a; color: var(--term-ink); font: inherit; font-size: 13px; cursor: pointer; box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
.m-new:hover { background: #2d3d47; }
.m-new[hidden] { display: none; }
#mirror .m-note { color: var(--term-dim); font-size: 13px; padding-bottom: 8px; border-bottom: 1px dashed rgba(255, 255, 255, .15); }
#mirror .m-you { color: #9fd6b8; font-weight: 600; white-space: pre-wrap; margin-top: 14px; }
#mirror .m-said { max-width: 90ch; }
#mirror .md > * { margin: 0; }
#mirror .md > * + * { margin-top: 6px; }
#mirror .md ul, #mirror .md ol { padding-left: 1.4em; }
#mirror .md li + li { margin-top: 2px; }
#mirror .md code { font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; background: rgba(255, 255, 255, .07); border-radius: 3px; padding: 0 3px; overflow-wrap: anywhere; }
#mirror .md pre { font-size: 12.5px; background: rgba(0, 0, 0, .25); border-radius: 3px; padding: 8px 10px; overflow-x: auto; white-space: pre; }
#mirror .md pre code { background: none; padding: 0; }
#mirror .md strong { color: #f1eee6; font-weight: 600; }
#mirror .md a { color: #8cc3e8; }
#mirror .md .md-h { font-weight: 650; color: #f1eee6; margin-top: 10px; }
#mirror .md .md-h1, #mirror .md .md-h2 { font-size: 15px; }
#mirror .md .md-quote { border-left: 3px solid rgba(255, 255, 255, .18); padding-left: 10px; color: var(--term-dim); }
#mirror .m-more { margin-left: 8px; padding: 0 7px; border: 1px solid #3b4a52; border-radius: 10px; background: transparent; color: var(--term-dim); font: inherit; font-size: 12px; cursor: pointer; vertical-align: baseline; }
#mirror .m-more:hover { color: var(--term-ink); border-color: #5b6a72; }
#mirror .m-now { color: var(--term-dim); font-style: italic; }
#mirror .m-run { font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12.5px; color: #c9cfd2; white-space: pre-wrap; overflow-wrap: anywhere; }
#mirror .m-run .m-mark { display: inline-block; width: 1.2em; }
#mirror .m-run.ok .m-mark { color: #5eba8b; }
#mirror .m-run.bad .m-mark { color: #e8735f; }
#mirror .m-run.running .m-mark { color: #d9aa4a; }
#term-empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; justify-content: center; padding: 32px; color: var(--term-dim); max-width: 60ch; }
#term-empty[hidden], #xterm[hidden], #mirror[hidden] { display: none; }
#term-empty .go-btn { background: var(--term-ink); color: var(--term-bg); }

.guess { background: var(--paper); box-shadow: var(--shadow); border-radius: 2px; padding: 10px 14px 12px 19px; position: relative; }
.guess::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--review); }
.guess .g-who { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; }
.guess .g-who .call { color: var(--ink); font-size: 14px; }
.guess .g-who .grow { flex: 1; }
.guess .g-text { font-size: 15px; margin-top: 3px; }
.guess .g-text code { font-size: 12.5px; color: var(--ink-2); margin-left: 6px; }
.guess .why { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.guess .options { margin-top: 8px; }
.guess .opt { padding: 4px 10px; font-size: 13.5px; }
#list .talk, #list .learning { padding: 0 4px; }
#list .about { font-size: 13.5px; }

/* ---------- loading: a thin bar while anything is on its way, and grey shapes where
   things will be, so the page never sits blank ---------- */
#busy { position: fixed; inset: 0 0 auto 0; height: 2px; z-index: 50; overflow: hidden; pointer-events: none; }
#busy[hidden] { display: none; }
#busy::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 30%; background: var(--ink-2); animation: busy 1.1s ease-in-out infinite; }
@keyframes busy { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.skel { border-radius: 3px; background: linear-gradient(90deg, rgba(127, 127, 127, .13) 25%, rgba(127, 127, 127, .24) 45%, rgba(127, 127, 127, .13) 65%); background-size: 300% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.skel-card { padding: 12px 14px; display: grid; gap: 8px; }
.skel-line { height: 11px; }
@media (prefers-reduced-motion: reduce) { #busy::before, .skel { animation: none; } }

/* ---------- a thread's card: a dot for its state, one dot per prompt (how each went),
   its numbers, and more under the arrow ---------- */
:root { --t-ok: #3f9d6e; --t-warn: #c08a1e; --t-bad: #c8553f; --t-run: #2f6fd0; --t-talk: #9aa3a6; }
.th-row { grid-template-columns: minmax(0, 1fr) auto auto auto; }
.sdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 6px 1px 0; vertical-align: middle; background: var(--kind, var(--ink-3)); }
.k-working .sdot { background: var(--t-run); animation: t-pulse 1.4s ease-in-out infinite; }
.k-closed .sdot { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.th-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 5px; font-size: 12.5px; color: var(--ink-2); font-stretch: 87%; }
.arc { display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.arc i { width: 7px; height: 7px; border-radius: 50%; background: var(--t-talk); flex: none; }
.arc i.r { width: 5px; height: 5px; opacity: .8; }
.arc i.k-resume { border-radius: 1px; transform: rotate(45deg); width: 5px; height: 5px; }
.arc .older { color: var(--ink-3); font-size: 11.5px; margin-right: 3px; }
.t-ok { --tone: var(--t-ok); } .t-warn { --tone: var(--t-warn); } .t-bad { --tone: var(--t-bad); } .t-run { --tone: var(--t-run); } .t-talk { --tone: var(--t-talk); }
.arc i[class*="t-"] { background: var(--tone); }
.arc i.t-talk { background: none; box-shadow: inset 0 0 0 1.3px var(--t-talk); }
.arc i.t-run { animation: t-pulse 1.2s ease-in-out infinite; }
.th-stats span + span::before { content: "·"; margin: 0 6px; color: var(--ink-3); }
.th-stats .bad { color: var(--t-bad); }
.th-chev { align-self: start; margin: 6px 0 0 -6px; width: 26px; height: 30px; border: 0; border-radius: 2px; background: none; color: var(--ink-3); display: inline-flex; align-items: center; justify-content: center; }
.th-chev:hover { color: var(--ink); background: var(--paper-hi); }
.th-chev svg { transition: transform .18s ease; }
.th-chev[aria-expanded="true"] svg { transform: rotate(180deg); }
#list .th-chev { margin-top: 4px; }
.th-more { padding: 2px 16px 12px calc(7px + 12px + var(--namew) + 14px); font-size: 13px; color: var(--ink-2); }
.th-more.anim { animation: open-down .18s ease-out; }
@keyframes open-down { from { opacity: 0; transform: translateY(-4px); } }
.th-more ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.th-more li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; }
.th-more li > b { color: var(--ink-3); font-weight: 500; }
.th-more li > span { color: var(--ink); min-width: 0; overflow-wrap: anywhere; }
.th-more .asks { display: grid; gap: 2px; }
.th-more .asks div { display: flex; gap: 7px; align-items: baseline; }
.th-more .asks i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--tone, var(--t-talk)); transform: translateY(-1px); }
.th-more .asks .t-talk i { background: none; box-shadow: inset 0 0 0 1.3px var(--t-talk); }
@media (max-width: 620px) { .th-more { padding-left: 21px; } }

/* ---------- right: a thread's story. Each prompt you gave is a step on a line from the
   start; a new topic branches off the start, a follow-up hangs off the step before.
   Drag to move around, Ctrl+wheel or the buttons to zoom. ---------- */
#term-head .vseg { display: inline-flex; border: 1px solid rgba(255, 255, 255, .25); border-radius: 3px; overflow: hidden; flex: none; }
#term-head .vseg button { border: 0; border-radius: 0; padding: 2px 10px; color: var(--term-dim); }
#term-head .vseg button[aria-pressed="true"] { background: rgba(255, 255, 255, .14); color: var(--term-ink); }
#story { position: absolute; inset: 0; --s-ok: #5eba8b; --s-warn: #d9aa4a; --s-bad: #e8735f; --s-run: #6aa8e8; --s-talk: #8f989c; }
#story[hidden] { display: none; }
#s-vp { position: absolute; inset: 42px 0 0 0; overflow: auto; cursor: grab; scrollbar-color: #3b4a52 transparent; outline: none; }
#s-vp.drag { cursor: grabbing; user-select: none; }
#s-size { position: relative; }
#s-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; padding: 14px 28px 120px 10px; }
#s-edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
#s-edges path { fill: none; stroke-width: 1.6; stroke-linecap: round; opacity: .75; }
#s-edges .spine { stroke: #4b5a62; stroke-dasharray: 2 4; }
#s-edges circle { stroke: var(--term-bg); stroke-width: 2.5; }
#s-edges circle.t-ok { fill: var(--s-ok); } #s-edges circle.t-warn { fill: var(--s-warn); } #s-edges circle.t-bad { fill: var(--s-bad); }
#s-edges circle.t-run { fill: var(--s-run); animation: t-pulse 1.2s ease-in-out infinite; }
#s-edges circle.t-talk { fill: var(--term-bg); stroke: var(--s-talk); stroke-width: 1.6; }
#s-edges circle.root { fill: var(--term-ink); }
#s-rows { position: relative; width: calc(var(--gutter, 40px) + 600px); }
#s-rows > * { margin-left: var(--gutter, 40px); }
#s-rows > * + * { margin-top: 6px; }
.s-root { padding: 2px 0 12px; }
.s-root .s-title { font-size: 16px; font-weight: 600; color: #f1eee6; line-height: 1.35; }
.s-root .s-sub { margin-top: 3px; color: var(--term-dim); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.s-node { border-radius: 4px; background: rgba(255, 255, 255, .035); border: 1px solid rgba(255, 255, 255, .06); border-left: 3px solid var(--topic, #4b5a62); transition: background .15s, border-color .15s; }
.s-node.fresh { animation: node-in .35s ease-out; }
@keyframes node-in { from { opacity: 0; transform: translateY(6px); } }
.s-node:hover { background: rgba(255, 255, 255, .06); }
.s-node.open { background: rgba(255, 255, 255, .07); border-color: rgba(255, 255, 255, .12); border-left-color: var(--topic, #4b5a62); }
.s-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; padding: 6px 10px 6px 9px; border: 0; background: none; color: var(--term-ink); text-align: left; font: inherit; font-size: 13.5px; cursor: pointer; }
.s-n { color: #6b767b; font-size: 11.5px; font-variant-numeric: tabular-nums; min-width: 1.6em; }
.s-ask { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-meta { display: inline-flex; gap: 9px; color: var(--term-dim); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.s-meta .bad { color: var(--s-bad); }
.s-node.k-reply, .s-node.k-stop, .s-node.k-resume { background: none; border-color: transparent; border-left-color: transparent; }
.s-node.k-reply .s-head, .s-node.k-stop .s-head, .s-node.k-resume .s-head { padding-top: 2px; padding-bottom: 2px; font-size: 12.5px; }
.s-node.k-reply .s-ask, .s-node.k-stop .s-ask, .s-node.k-resume .s-ask { font-weight: 400; color: var(--term-dim); }
.s-node.k-stop .s-ask { color: var(--s-bad); }
.s-node.k-resume .s-ask { font-style: italic; }
.s-node.k-reply.open, .s-node.k-stop.open, .s-node.k-resume.open { background: rgba(255, 255, 255, .05); }
.s-body { padding: 2px 12px 10px calc(9px + 1.6em + 10px); font-size: 13px; line-height: 1.5; color: #d5d2c9; cursor: auto; }
.s-body > * + * { margin-top: 7px; }
.s-body .s-lbl { display: inline-block; min-width: 58px; color: #6b767b; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
.s-body .s-you { white-space: pre-wrap; overflow-wrap: anywhere; color: #9fd6b8; }
.s-body .s-steps { color: var(--term-dim); font-style: italic; }
.s-body ul { margin: 0; padding-left: 1.2em; }
.s-body li + li { margin-top: 2px; }
.s-body li::marker { color: #5b6a72; }
.s-body li.bad { color: #f0a091; }
.s-body li.bad::marker { content: "✗  "; color: var(--s-bad); }
.s-body .s-said ul { padding-left: 1.2em; }
.s-body .s-saidhead { color: #f1eee6; }
.s-body code { font-family: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace; font-size: 12px; background: rgba(255, 255, 255, .07); border-radius: 3px; padding: 0 4px; }
.s-body .s-files { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--term-dim); font-size: 12px; }
.s-body .s-act button { border: 1px solid #3b4a52; background: none; color: var(--term-dim); border-radius: 10px; padding: 1px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.s-body .s-act button:hover { color: var(--term-ink); border-color: #5b6a72; }
.s-body .skel, .s-skel .skel { background: linear-gradient(90deg, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .11) 45%, rgba(255, 255, 255, .05) 65%); background-size: 300% 100%; }
.s-skel { padding: 9px 10px; display: grid; gap: 7px; border-left: 3px solid #2b363c; }
#story .m-more { margin-left: 8px; padding: 0 7px; border: 1px solid #3b4a52; border-radius: 10px; background: transparent; color: var(--term-dim); font: inherit; font-size: 12px; cursor: pointer; }
.s-empty { color: var(--term-dim); padding: 8px 0; }
/* zoomed out: only the shape and the few words */
#s-world.far .s-meta, #s-world.far .s-body, #s-world.far .s-root .s-sub { display: none; }
/* zoomed out, the words grow so they stay readable at the smaller scale */
#s-world.far .s-head { font-size: 19px; padding-top: 8px; padding-bottom: 8px; }
#s-world.far .s-node.k-reply .s-head, #s-world.far .s-node.k-stop .s-head, #s-world.far .s-node.k-resume .s-head { font-size: 16px; }
#s-world.far .s-n { font-size: 15px; }
#story::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 42px; border-bottom: 1px solid rgba(255, 255, 255, .07); }
#s-world.far .s-root .s-title { font-size: 22px; }
.s-tools { position: absolute; top: 8px; right: 12px; display: flex; gap: 4px; align-items: center; padding: 2px; border-radius: 4px; background: rgba(22, 27, 30, .92); }
.s-tools button { border: 1px solid #3b4a52; background: rgba(22, 27, 30, .85); color: var(--term-ink); border-radius: 3px; min-width: 28px; height: 26px; padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer; }
.s-tools button:hover { border-color: #5b6a72; }
.s-tools .z { color: var(--term-dim); font-size: 12px; min-width: 38px; text-align: center; font-variant-numeric: tabular-nums; }
.s-legend { position: absolute; left: 12px; top: 13px; display: flex; gap: 12px; font-size: 11.5px; color: var(--term-dim); background: rgba(22, 27, 30, .85); padding: 3px 8px; border-radius: 3px; pointer-events: none; }
.s-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: var(--c); }
#mirror .m-flash { animation: flash 1.6s ease-out; border-radius: 3px; }
@keyframes flash { from { background: rgba(106, 168, 232, .28); } }
@media (prefers-reduced-motion: reduce) { .s-node.fresh, .th-more.anim, #s-edges circle.t-run, .arc i.t-run, .k-working .sdot { animation: none; } }

/* ---------- the rail on the right edge: one mark per prompt, the one you're reading
   drawn long and bright. Point at a mark to see the prompt; click it to go there. ---------- */
#rail { position: absolute; right: 16px; top: 56px; bottom: 40px; width: 24px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; z-index: 3; }
#rail[hidden], #rail-tip[hidden] { display: none; }
.rk { flex: none; width: 24px; min-height: 2px; border: 0; padding: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: flex-end; }
.rk::before { content: ""; height: 2px; width: 10px; border-radius: 1px; background: #56646b; transition: width .12s ease, background .12s ease; }
.rk.r::before { width: 6px; }
.rk.t-bad::before { background: #9a5446; }
.rk.t-run::before { background: #6aa8e8; animation: t-pulse 1.2s ease-in-out infinite; }
.rk:hover::before, .rk:focus-visible::before { width: 16px; background: #c9cfd2; }
.rk.on::before { width: 20px; height: 3px; background: var(--term-ink); }
.rk:focus-visible { outline: none; }
#rail-tip { position: absolute; right: 46px; transform: translateY(-50%); max-width: min(360px, 70%); padding: 5px 10px; border-radius: 4px; background: #24313a; border: 1px solid #3b4a52; color: var(--term-ink); font-size: 12.5px; line-height: 1.4; pointer-events: none; z-index: 4; box-shadow: 0 4px 14px rgba(0, 0, 0, .4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#rail-tip .n { color: var(--term-dim); margin-right: 7px; font-variant-numeric: tabular-nums; }
#rail-tip .w { color: var(--term-dim); margin-left: 7px; }
.s-node.flash { animation: flash 1.4s ease-out; }
@media (prefers-reduced-motion: reduce) { .rk.t-run::before { animation: none; } }

/* ---------- the look, one pass: softer corners, depth by light rather than lines, one
   accent per state. Later rules here refine the ones above. ---------- */
#right { border-radius: 8px; background: linear-gradient(180deg, #1b2125 0%, #151a1d 100%); box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 8px 28px rgba(16, 24, 28, .22); }
#term-head { min-height: 46px; align-items: center; padding: 8px 12px 8px 16px; background: rgba(255, 255, 255, .025); border-bottom: 1px solid rgba(255, 255, 255, .07); }
#term-head .call { font-size: 16px; font-weight: 650; letter-spacing: .01em; }
#term-head .vseg { border: 0; background: rgba(255, 255, 255, .06); border-radius: 7px; padding: 2px; gap: 2px; }
#term-head .vseg button { border-radius: 5px; padding: 3px 12px; font-size: 12.5px; transition: background .15s, color .15s; }
#term-head .vseg button[aria-pressed="true"] { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
#term-head > button { border-radius: 6px; border-color: rgba(255, 255, 255, .2); transition: border-color .15s, background .15s; }
#term-head > button:hover { background: rgba(255, 255, 255, .06); }
#story::before { background: rgba(255, 255, 255, .015); }
.s-tools { background: none; }
.s-tools button { border-radius: 6px; border-color: rgba(255, 255, 255, .12); background: rgba(255, 255, 255, .04); transition: background .15s, border-color .15s; }
.s-tools button:hover { background: rgba(255, 255, 255, .1); }
.s-legend { background: none; }

/* a step in the story: a card that lifts a little under the pointer and rings in its
   topic's color when open */
.s-node { border-radius: 7px; background: #1e262a; border: 1px solid #283237; border-left: 3px solid var(--topic, #4b5a62); transition: background .15s, border-color .15s, box-shadow .2s, transform .15s; }
.s-node:hover { background: #222b30; border-color: #334046; border-left-color: var(--topic, #4b5a62); transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0, 0, 0, .25); }
.s-node.open { background: #222b30; border-color: color-mix(in srgb, var(--topic, #4b5a62) 45%, #283237); border-left-color: var(--topic, #4b5a62); box-shadow: 0 10px 30px rgba(0, 0, 0, .35); transform: none; }
.s-node.k-reply:hover, .s-node.k-stop:hover, .s-node.k-resume:hover { transform: none; box-shadow: none; background: rgba(255, 255, 255, .03); }
.s-head { padding: 8px 12px 8px 10px; }
.s-n { display: inline-block; min-width: 22px; height: 18px; line-height: 18px; text-align: center; border-radius: 9px; background: rgba(255, 255, 255, .06); color: #8c979c; font-size: 11px; }
.s-node.k-ask .s-ask { color: #eeebe3; }
.s-meta span { padding: 0 6px; border-radius: 8px; background: rgba(255, 255, 255, .05); }
.s-meta .bad { background: rgba(232, 115, 95, .12); }
.s-body { padding: 4px 14px 12px 44px; border-top: 1px solid rgba(255, 255, 255, .05); }
.s-body .s-you { padding: 7px 10px; border-radius: 6px; background: rgba(94, 186, 139, .07); border: 1px solid rgba(94, 186, 139, .14); margin-top: 8px; }
.s-node.flash { animation: ring 1.4s ease-out; }
@keyframes ring { from { box-shadow: 0 0 0 3px rgba(106, 168, 232, .55); } to { box-shadow: 0 0 0 0 rgba(106, 168, 232, 0); } }

/* the session view: one box per prompt, its head pinned while you read inside it */
#mirror { padding-top: 14px; }
#m-turns > * + * { margin-top: 14px; }
.m-prompt { border: 1px solid #2a3439; border-radius: 9px; background: rgba(255, 255, 255, .02); box-shadow: inset 3px 0 0 var(--tone, #4b5a62); transition: box-shadow .2s; }
.m-prompt.t-ok { --tone: #5eba8b; } .m-prompt.t-warn { --tone: #d9aa4a; } .m-prompt.t-bad { --tone: #e8735f; } .m-prompt.t-run { --tone: #6aa8e8; } .m-prompt.t-talk { --tone: #5b6a72; }
.m-prompt.m-orphan { border-style: dashed; box-shadow: none; }
.m-ph { position: sticky; top: -14px; z-index: 1; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto auto; gap: 10px; align-items: start; padding: 10px 10px 10px 14px; background: #20282c; border-bottom: 1px solid #2a3439; border-radius: 9px 9px 0 0; }
.m-pn { min-width: 24px; height: 20px; line-height: 20px; margin-top: 1px; text-align: center; border-radius: 10px; font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; color: #0f1416; background: var(--tone, #5b6a72); }
.m-prompt.t-talk .m-pn { color: var(--term-ink); background: #3a464c; }
#mirror .m-ph .m-you { margin: 0; color: #f1eee6; font-weight: 550; }
.m-pm { display: inline-flex; gap: 5px; margin-top: 2px; color: var(--term-dim); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.m-pm span { padding: 0 6px; border-radius: 8px; background: rgba(255, 255, 255, .06); }
.m-pm .bad { color: #f0a091; background: rgba(232, 115, 95, .12); }
.m-fold { width: 24px; height: 22px; border: 0; border-radius: 5px; background: none; color: var(--term-dim); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.m-fold:hover { background: rgba(255, 255, 255, .08); color: var(--term-ink); }
.m-fold svg { transition: transform .18s; }
.m-fold[aria-expanded="false"] svg { transform: rotate(-90deg); }
.m-work { padding: 10px 14px 12px 16px; }
.m-work > * + * { margin-top: 6px; }
.m-prompt.folded .m-work, .m-work:empty { display: none; }
.m-ph:has(+ .m-work:empty) { border-bottom: 0; border-radius: 9px; }
.m-ph:has(+ .m-work:empty) .m-fold { visibility: hidden; }
#mirror .m-ph .m-you.m-quiet { font-weight: 400; font-style: italic; color: var(--term-dim); }
#mirror .m-carried { margin-top: 8px; font-style: normal; white-space: pre-wrap; max-height: 40vh; overflow: auto; padding: 8px 10px; border-radius: 6px; background: rgba(0, 0, 0, .2); color: #c9cfd2; font-size: 12.5px; }
#mirror .m-carried[hidden] { display: none; }
.m-prompt.folded .m-ph { border-bottom: 0; border-radius: 9px; position: static; }
#mirror .m-prompt.m-flash { animation: ring 1.6s ease-out; }
#mirror .m-run { padding: 1px 0; }
#mirror .m-said { padding: 2px 0; }

/* the left side is the threads, all of it */
#list { flex: 1 1 auto; max-height: none; gap: 8px; --namew: 116px; }
#list .th-name .arc { margin-top: 5px; max-width: var(--namew); }
#list .th-row { align-items: center; }
#list .th-head { align-items: start; }
#list .th-now { padding-top: 2px; }
#list .th-now .ps { max-height: 6em; }

/* on the dark side, the light side's pieces take the dark palette: the notes and learned
   lists, the ⋯ menu, the note box under a thread, and the story's summary card */
.dark { color: var(--term-ink);
  --ink: #e6e3da; --ink-2: #a3acb0; --ink-3: #6b767b; --paper: #151a1d; --paper-hi: #263036; --rule: #34414a; --rack: #151a1d; --good: #5eba8b; --bad: #e8735f; --action: #8cc3e8; --focus: #8cc3e8; --review: #b892e0; --shadow: none; }
.dark .md > * { margin: 0; }
.dark .md > * + * { margin-top: 6px; }
.dark .md ul, .dark .md ol { padding-left: 1.4em; }
.dark .md code { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; font-size: 12.5px; background: rgba(255, 255, 255, .07); border-radius: 3px; padding: 0 3px; overflow-wrap: anywhere; }
.dark .md pre { font-size: 12.5px; background: rgba(0, 0, 0, .25); border-radius: 4px; padding: 8px 10px; overflow-x: auto; }
.dark .md strong, .dark .md .md-h { color: #f1eee6; font-weight: 600; }
.dark .said { max-height: 22em; overflow: auto; font-size: 13.5px; line-height: 1.5; white-space: normal; }
.dark .send input, .dark .send select, .dark .form.row input[type=text] { color: var(--ink); background: #151a1d; border: 1px solid #34414a; border-radius: 6px; padding: 5px 9px; }
.dark .send button, .dark .opt, .dark .seg button { color: var(--ink); border: 1px solid #45535a; border-radius: 6px; background: none; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.dark .send button:hover, .dark .opt:hover, .dark .seg button:hover { border-color: #6b767b; background: rgba(255, 255, 255, .05); }
.dark .opt.allow { border-color: var(--good); color: var(--good); }
.dark .opt.deny { border-color: var(--bad); color: var(--bad); }
.dark .opt.quiet-opt { border-color: transparent; color: var(--ink-2); }
.dark .seg button[aria-pressed="true"] { background: var(--ink); color: #151a1d; }
.dark .hint { color: var(--ink-2); }
.dark .did .files .base { color: var(--ink); }
.dark .knows { margin-top: 0; }
.dark .goal-head { display: none; }
.dark .knows .work { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; }
.dark .knows .work li { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.dark .knows .work b { color: var(--ink); font-weight: 600; }
.dark .err { color: #f0a091; font-size: 13px; margin-top: 6px; }
.i-sec { background: #1e262a; border: 1px solid #2a3439; border-radius: 9px; padding: 12px 16px 14px; }
.i-sec > h3 { margin: 0 0 9px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8c979c; display: flex; gap: 8px; align-items: baseline; }
.i-sec > h3 .grow { flex: 1; }

/* right, a list for the whole desk (the notes, what was learned), picked from the top
   of the left */
#info { position: absolute; inset: 0; overflow: auto; padding: 16px 22px 24px; font-size: 14px; }
#info[hidden] { display: none; }
#info > * + * { margin-top: 12px; }
#info .about { color: var(--ink-2); font-size: 13.5px; }
#info .talk { margin-top: 0; gap: 2px; }
#info .talk .note { grid-template-columns: 44px minmax(0, 1fr); padding: 6px 8px; border-radius: 6px; }
#info .talk .note:hover { background: rgba(255, 255, 255, .03); }
#info .talk .note.unread { background: rgba(140, 195, 232, .07); }

<body>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script>
"use strict";
const TOKEN = "__TOKEN__";
// `sel`: the thread shown bottom left. `focus`: the one whose terminal is on the right,
// once you've picked one with its terminal button (until then, the selected thread's).
const ui = { open: new Set(), data: null, version: "", pending: false, sending: false, composing: false, seen: new Set(), err: {}, drop: new Set(), starting: false, looked: 0, sel: null, focus: null, closing: null, mirror: { session: null },

  // `page`, one of the desk's own lists (the notes, what was learned), picked at the top left.
  view: "story", page: null, pageRepo: null, menu: false, storyAt: null, story: { session: null }, rail: { mode: null, session: null, steps: [], sig: "", active: -1 }, storyOpen: new Map(), busy: 0, opened: null };

// The thin bar at the top: on while the first state or anything you asked for is on its way.
function busy(d) {
  ui.busy = Math.max(0, ui.busy + d);
  document.getElementById("busy").hidden = ui.busy === 0 && !!ui.data;
}

// "New since you last looked": when you left the page, kept in this browser only, so
// the desk stays a view of the log with no state of its own.
const LOOKED = "af-desk-looked";
const lookedAt = () => { try { return Number(localStorage.getItem(LOOKED)) || 0; } catch { return 0; } };
const leave = () => { try { localStorage.setItem(LOOKED, String(Date.now())); } catch { /* private window */ } };

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") leave();
  else { ui.looked = lookedAt(); render(); }
});
addEventListener("pagehide", leave);
const isNew = (at) => ui.looked > 0 && at > ui.looked;

async function api(path, body, signal) {
  const res = await fetch(path, body === undefined
    ? { headers: { "x-desk-token": TOKEN }, signal }
    : { method: "POST", headers: { "x-desk-token": TOKEN, "content-type": "application/json" }, body: JSON.stringify(body) });
  const out = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(out.error || `HTTP ${res.status}`);
  return out;
}

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

function ago(ms, now) {
  const s = Math.max(0, Math.round((now - ms) / 1000));
  if (s < 60) return `${s}s`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m`;
  const hr = Math.round(m / 60);
  return hr < 48 ? `${hr}h` : `${Math.round(hr / 24)}d`;
}
const cmdOf = (detail) => {
  try { const v = JSON.parse(detail); return v.command || v.path || v.url || detail; } catch { return detail || ""; }
};
const plural = (n, one, many) => `${n} ${n === 1 ? one : many || `${one}s`}`;
const base = (f) => f.split(/[\\/]/).pop();

// ---------- actions ----------

// `clear`: the boxes to empty once it went through (what you typed stays if it failed).
async function act(path, body, errKey, clear) {
  ui.sending = true;
  busy(1);
  let ok = false;
  try {
    await api(path, body);
    delete ui.err[errKey];
    for (const k of [].concat(clear || [])) ui.drop.add(k);
    ok = true;
  } catch (e) {
    ui.err[errKey] = e.message;
  } finally {
    ui.sending = false;
    busy(-1);
    render();
  }
  return ok;
}
const toggle = (k) => { ui.open.has(k) ? ui.open.delete(k) : (ui.open.add(k), ui.opened = k); render(); ui.opened = null; };
const jump = (name, k) => act("/api/jump", { terminal: name }, k || `t:${name}`);
// What you picked and which terminal is on the right survive a reload of this tab.
const PICKED = "af-desk-picked";
try { Object.assign(ui, JSON.parse(sessionStorage.getItem(PICKED) || "{}")); } catch { /* nothing kept */ }
const keepPicked = () => { try { sessionStorage.setItem(PICKED, JSON.stringify({ sel: ui.sel, focus: ui.focus, view: ui.view, page: ui.page, pageRepo: ui.pageRepo })); } catch { /* private window */ } };
// Picking a thread shows its story on the right. A note from it to you waiting unread opens
// its note box, since that's likely why you picked it.
const select = (name) => {
  if (ui.focus !== name || ui.sel !== name || ui.page) ui.view = "story";
  ui.sel = name; ui.focus = name; ui.page = null; ui.menu = false;
  if (ui.data && ui.data.forYou.some((n) => n.from === name)) ui.open.add(`dock:${name}`);
  keepPicked(); render();
};
const focusName = () => ui.focus || ui.sel;
// Put a thread's terminal on the right, and the keyboard in it when it's one on the desk.
const show = (name) => { ui.focus = name; ui.sel = name; ui.view = "live"; ui.page = null; ui.menu = false; keepPicked(); render(); setTimeout(() => { if (XT.name === name) XT.term.focus(); }, 0); };
// Go to a thread's terminal: the one on the desk with the keyboard in it, or its own
// Windows Terminal tab brought forward (its session shown here meanwhile).
const goTo = (name) => {
  const d = ui.data;
  const t = d && d.threads.find((x) => x.name === name);
  const onDesk = !!d && d.hosted.some((x) => x.name === name && !x.exited);
  if (onDesk || !t) { show(name); return; }
  select(name);
  if (t.state !== "closed") jump(name);
};
// One of the desk's lists on the right; `repo` narrows what was learned to one repo.
const openPage = (page, repo) => { ui.page = page; ui.pageRepo = repo || null; ui.menu = false; keepPicked(); render(); document.getElementById("info").scrollTop = 0; };
const closePage = () => { ui.page = null; ui.pageRepo = null; keepPicked(); render(); };

  s.innerHTML = '<svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4.5 6.5l2.2 1.6-2.2 1.6M8.5 10.2h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return s;
}

// One thread in the list: who and where, what it's about, how long, and its terminal
// button. Picking the row shows the thread below; the button puts its terminal on the
// right. They're two buttons side by side, never one inside the other.
function rowEl(o) {
  const k = `card:${o.name}`;
  const open = !!o.more && ui.open.has(k);
  return h("div", { class: `strip th compact k-${o.kind}${o.sel ? " sel" : ""}${o.fresh ? " fresh" : ""}`, "data-name": o.name },
    h("div", { class: "th-row" },
      h("button", { class: "th-head", "aria-pressed": String(!!o.sel), title: o.tip, onclick: o.pick },
        // Under the name: its prompts as dots (else where it runs), so a card is two lines.
        h("span", { class: "th-name" },
          h("span", { class: "call" }, h("i", { class: "sdot", "aria-hidden": "true" }), o.isNew ? h("i", { class: "dot", title: "New since you last looked" }) : null, o.isNew ? h("span", { class: "sr" }, "New: ") : null, o.name),
          o.arc || (o.where ? h("span", { class: "where" }, o.where) : null)),
        h("span", { class: "th-text" },
          h("span", { class: "th-title" }, o.title),
          o.lines)),
      h("span", { class: `th-age${o.waiting ? " waiting" : ""}`, title: o.ageTip }, o.age),
      o.more ? h("button", { class: "th-chev", "aria-expanded": String(open), "aria-label": `More about ${o.name}`, title: open ? "Less" : "What it did, in short", onclick: () => toggle(k) }, chevron()) : h("span"),

    // What it waits on, with the answer buttons: always shown, it's why the card is there.
    o.now ? h("div", { class: "th-now" }, o.now) : null,
    open ? h("div", { class: `th-more${ui.opened === k ? " anim" : ""}` }, o.more()) : null);
}

// ---------- right: a terminal ----------
// One on the desk is the real thing, typed into here. One in a window of your own is
// followed from its session file, and "Type in its tab" brings that tab forward.

let XT = { name: null };

const PROGRESS_SAYS = { working: "Copilot is working", error: "Copilot hit an error", paused: "Copilot is paused" };
function attachTerm(name) {
  if (XT.name === name) return;

  el.hidden = false;
  if (!window.Terminal || !window.FitAddon) { el.textContent = "The terminal didn't load (vendor/xterm.js). Reload the page."; return; }

    fontFamily: '"Cascadia Mono", "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace', fontSize: 14, lineHeight: 1.12,
    cursorBlink: true, scrollback: 5000,

async function stream(x) {

    if (!res.ok) { x.term.write(`\r\n[${(await res.json().catch(() => ({}))).error || `HTTP ${res.status}`}]\r\n`); return; }
    const reader = res.body.getReader();
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      x.term.write(value);
    }

  // back the page reloads (its token is new) and draws it again from what was kept.

// A session of your own, followed as Copilot writes it. Turns are added at the end and a
// tool call's ending is marked where it stands: nothing you're reading is drawn again,
// so it doesn't move and what you selected stays selected. Earlier turns load as you
// scroll up; new ones below wait behind "new ↓" until you go down to them.
// Copilot writes markdown. Drawn as elements built from text nodes, never as HTML, so
// nothing in a session can put markup on the page.
function mdInline(text) {

    if (m.index > at) out.push(text.slice(at, m.index));
    if (m[2] !== undefined) out.push(h("code", null, m[2]));
    else if (m[3] !== undefined || m[4] !== undefined) out.push(h("strong", null, mdInline(m[3] ?? m[4])));

  empty.replaceChildren(
    h("p", null, "A thread's terminal shows here: click the terminal button on a thread. A thread you start with New thread runs here, and you type into it here."),
    h("button", { class: "go-btn", onclick: () => startOpen(true) }, "New thread"));
}

// ---------- the header's New thread, and the desk's lists: notes between threads, what sessions taught ----------

function startEl(d) {
  const k = "start";
  const folder = h("input", { type: "text", list: "af-folders", placeholder: "Folder, e.g. C:\\work\\billing", "aria-label": "Folder", "data-k": "start:folder" });
  const name = h("input", { type: "text", placeholder: "Name (else the folder's)", "aria-label": "Name", "data-k": "start:name", style: "flex:0 1 170px" });
  const own = h("input", { type: "checkbox", id: "start-own", checked: !!ui.startOwn, onchange: (e) => { ui.startOwn = e.target.checked; } });
  const go = async () => {
    if (!folder.value.trim()) { ui.err[k] = "Which folder?"; return render(); }
    const n = name.value.trim() || base(folder.value.trim()).replace(/[^\w.-]+/g, "-").replace(/^[^A-Za-z0-9]+/, "");
    const body = document.getElementById("term-body");
    const size = { cols: Math.max(40, Math.floor((body.clientWidth - 20) / 8.5)), rows: Math.max(10, Math.floor((body.clientHeight - 12) / 17)) };
    if (await act("/api/start", { folder: folder.value.trim(), name: name.value.trim(), ...(own.checked ? { where: "window" } : size) }, k, ["start:folder", "start:name"])) {
      ui.starting = false;
      ui.sel = n;
      // Kept while the next state, which has it, is on its way.
      ui.expect = { name: n, until: Date.now() + 20_000 };
      if (!own.checked) { ui.focus = n; ui.page = null; }
      keepPicked();
      render();
      setTimeout(() => { if (XT.name === n) XT.term.focus(); }, 50);
    }
  };
  const enter = (e) => { if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) go(); else if (e.key === "Escape") startOpen(false); };
  folder.addEventListener("keydown", enter);
  name.addEventListener("keydown", enter);
  return h("div", { class: "start" },
    h("h2", { class: "goal-head", style: "margin:0" }, h("span", { class: "call" }, "New thread")),
    h("datalist", { id: "af-folders" }, (d.folders || []).map((f) => h("option", { value: f }))),
    h("div", { class: "send" }, folder, name, h("button", { class: "go-btn", onclick: go }, "Open"), h("button", { class: "cancel", onclick: () => startOpen(false) }, "Cancel")),
    h("div", { class: "about" }, h("label", null, own, " In a window of its own instead"), ". Otherwise it opens on the right: PowerShell in that folder, running Copilot. Type your first prompt there."),
    ui.err[k] ? h("div", { class: "err" }, ui.err[k]) : null);
}
function startOpen(on) {
  ui.starting = on;
  delete ui.err.start;
  render();
  const b = document.getElementById("start");
  if (on) document.querySelector('[data-k="start:folder"]')?.focus(); else b.focus();
}
document.getElementById("start").onclick = () => startOpen(!ui.starting);
document.getElementById("away").onclick = () => act("/api/away", { on: !(ui.data && ui.data.teams && ui.data.teams.away) }, "away");

function talkEl(d) {
  const open = d.threads.filter((t) => t.state !== "closed").map((t) => t.name);
  const k = "send:talk";
  const sel = h("select", { "data-k": "talk:to", "aria-label": "To" }, [...open, ...(open.length > 1 ? ["all"] : [])].map((n) => h("option", { value: n }, n === "all" ? "every thread" : n)));
  // A thread's name opens it.
  const who = (n) => d.threads.some((t) => t.name === n) ? h("button", { title: `Open ${n}`, onclick: () => select(n) }, n) : n === "all" ? "every thread" : n;
  return [
    h("section", { class: "i-sec" }, h("h3", null, "Send a note"),
      h("div", { class: "about" }, "A note is read while a session works. It never starts one."),
      open.length ? h("div", { class: "send" }, sel, sendBox(() => sel.value, "A note…", k)) : h("div", { class: "hint" }, "No thread is open."),
      ui.err[k] ? h("div", { class: "err" }, ui.err[k]) : null),
    h("div", { class: "talk" }, d.notes.length ? d.notes.slice(0, 30).map((n) => {
      const unread = n.to === "you" && !n.delivered;
      return h("div", { class: `note${unread ? " unread" : ""}` },
        h("span", null, ago(n.at, d.now)),
        h("span", null, isNew(n.at) ? h("i", { class: "dot", title: "New since you last looked" }) : null,
          h("b", null, who(n.from), " → ", n.to === "you" ? "you" : who(n.to)), " ", n.text,
          unread ? h("button", { onclick: () => act("/api/read", { note: n.id }, k) }, "Got it")
            : !n.delivered ? h("span", { class: "st" }, " · waits for its next tool call") : null));
    }) : h("div", { class: "about" }, "No notes yet. A session sends one with the desk's note command, which it's told about at its start; you can above.")),
  ];
}

function guessEl(g, now) {
  const k = `know:${g.principal}:${g.entry}`;
  const who = g.principal === "you" ? "you" : g.principal.replace(/^repo\./, "");
  const words = ui.open.has(k);
  // The thread whose session taught it, while that thread is still on the desk.
  const from = g.session ? ui.data.threads.find((t) => t.session === g.session) : null;
  const mine = h("input", { type: "text", value: g.text, "aria-label": "In your words", "data-k": k });
  const why = h("input", { type: "text", placeholder: "What's wrong with it (optional)", "aria-label": "What's wrong with it", "data-k": `${k}:why` });
  return h("div", { class: "guess" },
    h("div", { class: "g-who" }, h("span", { class: "call" }, isNew(g.at) ? h("i", { class: "dot", title: "New since you last looked" }) : null, who), h("span", null, g.kind), h("span", { class: "grow" }), from ? h("span", null, "from ", h("button", { class: "who-link", title: `Open ${from.name}`, onclick: () => select(from.name) }, from.name)) : null, h("span", null, ago(g.at, now))),
    h("div", { class: "g-text" }, g.text, h("code", null, g.subject)),
    g.because ? h("div", { class: "why" }, g.because) : null,
    h("div", { class: "options" },
      h("button", { class: "opt rec allow", onclick: () => act("/api/know", { principal: g.principal, entry: g.entry, verdict: "right" }, k) }, "Right"),
      h("button", { class: "opt quiet-opt", "aria-expanded": String(words), onclick: () => toggle(k) }, words ? "Never mind" : "Change it or say why it's wrong")),
    words ? h("div", { class: "form row" }, mine, h("button", { class: "opt", onclick: () => act("/api/know", { principal: g.principal, entry: g.entry, verdict: "right", text: mine.value }, k) }, "Right, in these words")) : null,
    words ? h("div", { class: "form row" }, why, h("button", { class: "opt deny", onclick: () => act("/api/know", { principal: g.principal, entry: g.entry, verdict: "wrong", text: why.value }, k) }, "Wrong")) : null,
    ui.err[k] ? h("div", { class: "err" }, ui.err[k]) : null);
}

function learnedEl(d) {
  const l = d.learning;
  const repo = ui.pageRepo;
  const shown = repo ? d.guesses.filter((g) => g.principal === `repo.${repo}`) : d.guesses;
  return [
    h("div", { class: "about" }, shown.length ? "New sessions get these as guesses until you confirm them." : "Nothing to check.",
      repo ? h("span", { class: "filter", style: "margin-left:10px" }, `Only ${repo}`, h("button", { title: "Show every repo", "aria-label": "Show every repo", onclick: () => openPage("learned") }, "×")) : null),
    shown.map((g) => guessEl(g, d.now)),
    h("div", { class: "learning" },
      h("div", null, l.running ? `Reading ${l.running.repo || "a"} session ${l.running.session.slice(0, 8)}…` : l.queued ? `${plural(l.queued, "session")} waiting to be read.` : "Each finished session is read once."),
      l.recent.map((a) => h("div", { class: `row${a.ok ? "" : " bad"}` },
        h("span", null, ago(a.at, d.now)),
        h("span", null, a.error ? `${a.repo}: ${a.error}` : `${a.repo}: ${a.kept.length} learned${a.dropped.length ? `, ${a.dropped.length} left out` : ""}`),
        h("span", null, a.session.slice(0, 8)))),
      h("div", { class: "where" }, `Kept in ${d.knowledgeDir}`)),
  ];
}

// ---------- drawing ----------

function render() {
  const d = ui.data;
  if (!d) return;
  const f = document.activeElement;
  // A request on its way, an open dropdown, or a word half-typed in an input method
  // (pinyin): wait, then draw.
  if (ui.sending || ui.composing || (f && f.tagName === "SELECT")) { ui.pending = true; return; }
  ui.pending = false;
  // Redrawn as sessions move, so keep what you're typing and where your cursor is.
  const typed = {};
  for (const el of document.querySelectorAll("[data-k]")) typed[el.dataset.k] = el.value;
  const focus = f && f.dataset && f.dataset.k ? { k: f.dataset.k, s: f.selectionStart, e: f.selectionEnd } : null;

  const count = (g) => d.threads.filter((t) => t.thread === g).length + (g === "working" ? onlyHosted(d).length : 0);
  const needs = count("needs you");
  document.title = needs ? `(${needs}) AgentFactory desk` : "AgentFactory desk";
  const fresh = d.threads.some((t) => t.thread !== "working" && isNew(t.since)) || d.notes.some((n) => isNew(n.at)) || d.guesses.some((g) => isNew(g.at));
  document.getElementById("tally").replaceChildren(...[
    ...[["needs you", "approval", "need you"], ["your turn", "action", "your turn"], ["working", "working", "working"]]
      .filter(([g]) => count(g)).map(([g, kind, says]) => h("span", { class: `t-${kind}` }, h("i"), h("b", null, String(count(g))), says)),
    d.threads.some((t) => t.state !== "closed") || d.hosted.length ? null : h("span", null, "No thread open"),
    fresh ? h("span", { class: "new-key" }, h("i"), "new since you last looked") : null,
  ].filter(Boolean));
  document.getElementById("start").setAttribute("aria-pressed", String(ui.starting));
  // Away: every terminal's asks wait here and go to Teams or Slack. Shown once one is set up.
  const away = document.getElementById("away");
  away.hidden = !d.teams;
  if (d.teams) {
    away.setAttribute("aria-pressed", String(!!d.teams.away));
    away.textContent = d.teams.away ? `Away since ${new Date(d.teams.away).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}: I'm back` : `I'm away: send asks to ${d.teams.to}`;
    away.title = d.teams.away ? "Asks held only because you were away go back to their terminals." : d.teams.answers ? `Every terminal's permission asks wait here and reach you on ${d.teams.to} as cards.` : `Every terminal's permission asks wait here, and ${d.teams.to} tells you about each one. You answer when you're back.`;
  }
  // Nothing picked yet, or the pick is gone: the thread that waits on you longest.
  const names = [...d.threads.map((t) => t.name), ...d.hosted.map((x) => x.name)];
  if (ui.expect && (names.includes(ui.expect.name) || Date.now() > ui.expect.until)) ui.expect = null;
  if (ui.expect) names.push(ui.expect.name);
  if (!ui.sel || !names.includes(ui.sel)) ui.sel = d.threads[0]?.name ?? d.hosted[0]?.name ?? null;
  if (ui.focus && !names.includes(ui.focus)) ui.focus = null;
  document.getElementById("start-slot").replaceChildren(...(ui.starting ? [startEl(d)] : []));
  document.getElementById("list").replaceChildren(...threadsList(d).flat(Infinity).filter(Boolean));
  rightEl(d);

  for (const el of document.querySelectorAll("[data-k]")) {
    const k = el.dataset.k;
    if (!ui.drop.has(k) && k in typed && el.tagName !== "SELECT") el.value = typed[k];
    else if (el.tagName === "SELECT" && k in typed && [...el.options].some((o) => o.value === typed[k])) el.value = typed[k];
  }
  ui.drop.clear();
  if (focus) {
    const el = [...document.querySelectorAll("[data-k]")].find((x) => x.dataset.k === focus.k);
    if (el) {
      el.focus();
      try { el.setSelectionRange(focus.s, focus.e); } catch { /* not a text box */ }
    }
  }
  announce(d);
}
document.addEventListener("focusout", () => setTimeout(() => { if (ui.pending) render(); }, 0));
// Keys, when you're not typing: j and k for the next and previous thread, s and t for its
// story and its session (or terminal), [ and ] for the previous and next prompt, Escape to
// close the menu or a list.
document.addEventListener("keydown", (e) => {
  const f = e.target;
  if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  if (f.closest && (f.closest("input, textarea, select, [contenteditable], #xterm"))) return;
  const d = ui.data;
  if (!d) return;
  if (e.key === "Escape") { if (ui.menu) { ui.menu = false; render(); } else if (ui.page) closePage(); return; }
  if (e.key === "j" || e.key === "k") {
    const names = [...document.querySelectorAll("#list .th[data-name]")].map((el) => el.dataset.name);
    if (!names.length) return;
    const at = ui.page ? -1 : names.indexOf(focusName());
    const next = names[Math.max(0, Math.min(names.length - 1, at < 0 ? 0 : at + (e.key === "j" ? 1 : -1)))];
    if (next && (next !== focusName() || ui.page)) select(next);
    document.querySelector(`#list .th[data-name="${CSS.escape(next)}"]`)?.scrollIntoView({ block: "nearest" });
    e.preventDefault();
    return;
  }
  const t = d.threads.find((x) => x.name === focusName());
  if (ui.page || !t) return;
  if (e.key === "s") { switchView("story", t); e.preventDefault(); }
  else if (e.key === "t") { switchView("live", t); e.preventDefault(); }
  else if (e.key === "[" || e.key === "]") {
    const steps = railSteps();
    if (!steps.length) return;
    const k = steps.findIndex((s) => s.i === ui.rail.active);
    const s = steps[Math.max(0, Math.min(steps.length - 1, k < 0 ? steps.length - 1 : k + (e.key === "]" ? 1 : -1)))];
    railGo(s.i);
    e.preventDefault();
  }
});
document.addEventListener("compositionstart", () => { ui.composing = true; });
document.addEventListener("compositionend", () => { ui.composing = false; setTimeout(() => { if (ui.pending) render(); }, 0); });

// Quick open: every thread, the ones waiting on you first, narrowed as you type. Enter goes
// to its terminal, Shift+Enter to its story.
const QO = { items: [], at: 0, back: null };
const GROUP_ORDER = { "needs you": 0, "your turn": 1, working: 2 };
const GROUP_COLOR = { "needs you": "var(--approval, #e0a84a)", "your turn": "var(--good)", working: "var(--action)" };
function qoItems(q) {
  const d = ui.data;
  if (!d) return [];
  const all = [
    ...d.threads.map((t) => ({ name: t.name, title: t.title || "", where: t.cwd || "", group: t.thread, since: t.since || 0 })),
    ...onlyHosted(d).map((x) => ({ name: x.name, title: "a terminal on the desk", where: x.cwd, group: "working", since: x.started })),
  ];
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  return all
    .filter((i) => words.every((w) => `${i.name} ${i.title} ${i.where}`.toLowerCase().includes(w)))
    .sort((a, b) => (GROUP_ORDER[a.group] ?? 3) - (GROUP_ORDER[b.group] ?? 3) || (a.name.toLowerCase().startsWith(words[0] || "") ? 0 : 1) - (b.name.toLowerCase().startsWith(words[0] || "") ? 0 : 1) || a.since - b.since);
}
function qoDraw() {
  const list = document.getElementById("qo-list");
  QO.items = qoItems(document.getElementById("qo-in").value);
  QO.at = Math.max(0, Math.min(QO.at, QO.items.length - 1));
  if (!QO.items.length) { list.replaceChildren(h("li", { class: "qo-none" }, "No thread matches")); return; }
  list.replaceChildren(...QO.items.map((i, k) => h("li", { role: "option", "aria-selected": String(k === QO.at), onmousemove: () => { if (QO.at !== k) { QO.at = k; qoDraw(); } }, onclick: (e) => qoGo(k, e.shiftKey) },
    h("i", { style: `--c:${GROUP_COLOR[i.group] || "var(--ink-3)"}` }), h("b", null, i.name), h("span", { class: "qo-t" }, i.title), h("span", { class: "qo-w" }, i.group))));
  list.children[QO.at]?.scrollIntoView({ block: "nearest" });
}
function quickOpen() {
  const box = document.getElementById("qo");
  if (!box.hidden) return;
  QO.back = document.activeElement;
  QO.at = 0;
  box.hidden = false;
  const input = document.getElementById("qo-in");
  input.value = "";
  qoDraw();
  input.focus();
}
function qoClose(restore = true) {
  document.getElementById("qo").hidden = true;
  if (restore && QO.back && QO.back.focus) QO.back.focus();
}
function qoGo(k, story) {
  const i = QO.items[k];
  if (!i) return;
  qoClose(false);
  if (story) { select(i.name); switchView("story", ui.data.threads.find((t) => t.name === i.name)); } else goTo(i.name);
}
document.getElementById("qo-in").addEventListener("input", () => { QO.at = 0; qoDraw(); });
document.getElementById("qo-in").addEventListener("keydown", (e) => {
  if (e.isComposing) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { QO.at += e.key === "ArrowDown" ? 1 : -1; if (QO.at < 0) QO.at = QO.items.length - 1; if (QO.at >= QO.items.length) QO.at = 0; qoDraw(); e.preventDefault(); }
  else if (e.key === "Enter") { qoGo(QO.at, e.shiftKey); e.preventDefault(); }
  else if (e.key === "Escape") { qoClose(); e.preventDefault(); }
});
document.getElementById("qo").addEventListener("mousedown", (e) => { if (e.target.id === "qo") qoClose(); });
document.getElementById("qo-btn").addEventListener("click", () => quickOpen());
// Ctrl+K from anywhere but a terminal (where it's the shell's), Ctrl+Shift+K from anywhere.
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey || (e.key !== "k" && e.key !== "K")) return;
  const inTerm = e.target.closest && e.target.closest("#xterm");
  if (inTerm && !e.shiftKey) return;
  quickOpen();
  e.preventDefault();
}, true);

// A thread that starts needing you while you're elsewhere: a system notification, if
// you allowed them.
const told = new Set();
let first = true;
function announce(d) {
  for (const t of d.threads) {
    if (t.thread !== "needs you" && t.thread !== "your turn") continue;
    const id = `${t.session}:${t.since}`;
    if (told.has(id)) continue;
    told.add(id);
    // hasFocus rather than visibility: the desk's window can sit visible behind another one.
    if (!first && !document.hasFocus() && "Notification" in window && Notification.permission === "granted") {
      const n = new Notification(`${t.name} ${t.thread === "needs you" ? "needs you" : "finished: your turn"}`, { body: `${t.title}\n${t.why || ""}`, tag: id, icon: "/icon.svg" });
      // Clicking it goes straight to that thread's terminal.
      n.onclick = () => { window.focus(); goTo(t.name); n.close(); };
    }
  }
  first = false;
}
if ("Notification" in window && Notification.permission === "default") {
  const b = document.getElementById("notify");
  b.hidden = false;
  b.onclick = () => Notification.requestPermission().then(() => (b.hidden = true));
}

// Wait on the server for a change rather than polling on a timer: browsers slow
// timers in background tabs to a crawl, but not a request already waiting.
async function loop() {
  const off = document.getElementById("offline");
  for (;;) {
    try {
      const v = await api(`/api/state?since=${encodeURIComponent(ui.version)}&wait=${ui.version ? 25000 : 0}`);
      ui.version = v.version;
      ui.data = v;
      ui.wasOnline = true;
      off.hidden = true;
      render();
      busy(0);
    } catch (e) {
      // A desk that started again has a new token: reload to pick it up. Its terminals
      // stayed with the keeper, so they're drawn again as they are.
      if (/out of date/.test(e.message) && ui.wasOnline) { off.textContent = "The desk started again: reloading"; off.hidden = false; setTimeout(() => location.reload(), 300); return; }
      off.textContent = /out of date/.test(e.message) ? "This page is out of date. Reload it." : "Can't reach the desk. It comes back by itself when the desk runs again (npm run desk -- app).";
      off.hidden = false;
      await new Promise((r) => setTimeout(r, 3000));
    }
  }
}
setInterval(() => { if (ui.data) { ui.data.now = Date.now(); render(); } }, 15000);
loop();
